version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nexo-ollama-debian
    volumes:
      - ollama-data-debian:/root/.ollama
    ports:
      - "11436:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  visual-test-debian:
    build:
      context: .
      dockerfile: .docker/Dockerfile.test-visual-validation-debian
      args:
        DOTNET_VERSION: "8.0"
    image: nexo-visual-test:debian-8.0
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llava:7b
    volumes:
      - ./test-results:/workspace/test-results
    shm_size: 2gb
    command: >
      bash -c "
        echo '🎨 Waiting for Ollama to be ready...' &&
        for i in {1..30}; do
          if curl -f -s http://ollama:11434/api/tags > /dev/null 2>&1; then
            echo '✅ Ollama is ready' &&
            break
          fi
          echo \"   Waiting for Ollama... (attempt \$i/30)\" &&
          sleep 2
        done &&
        echo '🎨 Installing Playwright browsers...' &&
        playwright install chromium &&
        echo '🎨 Running Visual Validation Tests with Ollama (Debian)...' &&
        dotnet test src/Nexo.Tests.GeospatialVisual/Nexo.Tests.GeospatialVisual.csproj \
          --filter 'FullyQualifiedName~GeospatialVisualValidationTests' \
          --logger 'console;verbosity=detailed' \
          --logger 'trx;LogFileName=visual-validation-debian.trx' \
          --results-directory /workspace/test-results &&
        echo '✅ Visual validation tests completed'
      "

volumes:
  ollama-data-debian:
