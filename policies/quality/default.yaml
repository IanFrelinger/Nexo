# Quality Policy (v0.1)
meta:
  id: quality-default
  description: Baseline code quality gates and scoring.
  version: 0.1.0

gates:
  compile:
    must_succeed: true
  tests:
    must_pass: true
    min_coverage: 0.75          # 75% line coverage
  style:
    max_warnings: 50
    treat_analyzers_as_errors: true
  complexity:
    max_cyclomatic_average: 12
    max_cyclomatic_per_method: 20
  dependencies:
    disallow_prerelease: true
    audit:
      severity_fail_at: "high"  # low|moderate|high|critical
  commits:
    conventional_commits: true

# Weighted score for dashboards; gates still act as hard stops.
scoring:
  weights:
    compile: 0.25
    tests: 0.35
    style: 0.15
    complexity: 0.15
    dependencies: 0.10
  pass_threshold: 0.80

language_overrides:
  csharp:
    analyzer_ruleset: "policies/quality/csharp-baseline.yaml"
    roslyn:
      treat_warnings_as_errors: true
      required_diagnostics:
        - "CS0168"   # declared but never used
        - "CS8618"   # non-nullable uninitialized
        - "IDE0051"  # remove unused private members
      disabled_diagnostics:
        - "SYSLIB1045" # (example) if noisy for your target
  # Add more language sections as needed (python, ts, etc.)

outputs:
  report_dir: "./test-reports"
  formats: ["json", "md"]
  sarif: true
