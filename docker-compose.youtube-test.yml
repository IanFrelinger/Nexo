# Docker Compose for headless YouTube video summary tests
# Fully virtualized: Xvfb + Chrome + Nexo Universal Tester inside containers
# Run multiple instances in parallel: docker compose -f docker-compose.youtube-test.yml up --scale youtube-test=3
#
# Prerequisites:
#   - Ollama running (host or as a service). Pull a vision model (smol): ollama pull richardyoung/smolvlm2-2.2b-instruct (or llava:7b)
#   - Optional audio: nexo demo youtube-transcribe URL > transcript.txt, then -e AUDIO_TRANSCRIPT_FILE=/path/transcript.txt
#
# Usage:
#   # Full stack (Ollama + test in Compose):
#   docker compose -f docker-compose.youtube-test.yml up
#
#   # Test only, Ollama on host (parallel-friendly):
#   docker compose -f docker-compose.youtube-test.yml run --no-deps -e OLLAMA_BASE_URL=http://host.docker.internal:11434 youtube-test
#
#   # Parallel runs (3 videos, Ollama on host):
#   VIDEO_URL="https://youtube.com/watch?v=VID1" docker compose -f docker-compose.youtube-test.yml run youtube-test &
#   VIDEO_URL="https://youtube.com/watch?v=VID2" docker compose -f docker-compose.youtube-test.yml run youtube-test &
#   VIDEO_URL="https://youtube.com/watch?v=VID3" docker compose -f docker-compose.youtube-test.yml run youtube-test &
#   wait
#
version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nexo-youtube-ollama
    volumes:
      - ollama-youtube-data:/root/.ollama
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  youtube-test:
    build:
      context: .
      dockerfile: .docker/Dockerfile.youtube-test
    # Use linux/amd64 for Chrome .deb; on ARM (M1/M2) runs via emulation
    platform: linux/amd64
    image: nexo-youtube-test:latest
    environment:
      - VIDEO_URL=${VIDEO_URL:-https://www.youtube.com/watch?v=psbAgsMD8QM}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - VIDEO_TEST_BROWSER_PROCESS=chrome
    volumes:
      - ./test-results/youtube-reports:/workspace/reports
    # Linux hosts: host.docker.internal may not resolve; set OLLAMA_BASE_URL=http://HOST_IP:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
    shm_size: "2g"

volumes:
  ollama-youtube-data:
