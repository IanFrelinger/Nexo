name: Installer Bruteforce Gate

on:
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/installer-bruteforce-gate.yml"
      - "scripts/install/**"
      - "scripts/setup/**"
      - "docs/OneClickInstall.md"
      - "docs/OnboardingAutomation.md"
  pull_request:
    paths:
      - ".github/workflows/installer-bruteforce-gate.yml"
      - "scripts/install/**"
      - "scripts/setup/**"
      - "docs/OneClickInstall.md"
      - "docs/OnboardingAutomation.md"
  workflow_dispatch:

jobs:
  bruteforce-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x

      - name: Run installer brute-force matrix
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install/bruteforce-matrix.sh

      - name: Upload brute-force artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-bruteforce-matrix
          path: |
            ./artifacts/install_bruteforce_matrix.log
            ./artifacts/install_bruteforce_summary.log
          retention-days: 14
