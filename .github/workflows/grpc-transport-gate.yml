name: gRPC transport gate

on:
  pull_request:
    paths:
      - ".github/workflows/grpc-transport-gate.yml"
      - "scripts/grpc-transport-gate.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "src/Ashlar.Tests.Transport/**"
      - "src/Ashlar.Transport.Grpc/**"
      - "src/Ashlar.Abstractions/**"
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/grpc-transport-gate.yml"
      - "scripts/grpc-transport-gate.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "src/Ashlar.Tests.Transport/**"
      - "src/Ashlar.Transport.Grpc/**"
      - "src/Ashlar.Abstractions/**"
  workflow_dispatch:

jobs:
  grpc-transport:
    name: gRPC agent transport (Kestrel integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test Transport (ProdStyle, counted)
        shell: bash
        run: bash scripts/grpc-transport-gate.sh
        env:
          ASHLAR_ALLOW_MOCK: "1"
