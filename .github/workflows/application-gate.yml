# Application gate: product layer after kernel (tiers A–D).
# See docs/production-readiness/ApplicationHardeningPlan-v1.md
name: Application Gate

on:
  pull_request:
    paths:
      - "application/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/VirtualProduction/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/API/**"
      - "docs/production-readiness/Application*.md"
      - "scripts/application-gate*.sh"
      - "scripts/prod-dry-run.sh"
      - "Makefile"
      - ".github/workflows/application-gate.yml"
  workflow_dispatch:
    inputs:
      tier:
        description: "Gate tier"
        required: false
        default: "full"
        type: choice
        options:
          - a
          - b
          - c
          - d
          - full

jobs:
  application-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Tier A
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'a'
        run: make application-gate-tier-a
        env:
          ASHLAR_ALLOW_MOCK: "1"
          APPLICATION_GATE_SKIP_KERNEL: "1"

      # Runs on every pull_request, like Tier A above it. It was `github.event_name ==
      # 'workflow_dispatch' && …`, which is FALSE on a pull_request — this workflow's only automatic
      # trigger — so the lane existed and nothing ever ran it. Fixing a vacuous filter inside
      # scripts/application-gate-tier-b.sh moved the vacuous pass from the filter to this line; the
      # `!=` form is what actually selects the step, and it is the form Tier A already uses.
      # Listed 207 identities; the counted wrapper refuses a silent empty match.
      - name: Tier B
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'b'
        run: make application-gate-tier-b
        env:
          ASHLAR_ALLOW_MOCK: "1"

      # Same `!=` form as Tier A/B so pull_request actually runs the in-process
      # API suite. The script is counted on net10.0 (net8 matched zero).
      - name: Tier C
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'c'
        run: make application-gate-tier-c
        env:
          ASHLAR_ALLOW_MOCK: "1"

      - name: Tier D (agent-server dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'd'
        run: make application-gate-tier-d

      - name: Tier A–D (full)
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
        run: make application-gate-full
        env:
          ASHLAR_ALLOW_MOCK: "1"
          APPLICATION_GATE_SKIP_TIER_D: "1"
