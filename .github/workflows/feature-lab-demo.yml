name: Feature Lab Demo Readiness

on:
  push:
    branches: [ main, feat/feature-lab-demo ]
  pull_request:
    branches: [ main ]

jobs:
  feature-lab-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_AZURE: ${{ secrets.AZURE_OPENAI_ENDPOINT != '' && secrets.AZURE_OPENAI_KEY != '' }}
      TEST_RESULTS_DIR: TestResults
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build -c Release --no-restore
      
    - name: Seed fixtures
      run: ./demo/scripts/seed-fixtures.sh
      
    - name: Create test results directory
      run: mkdir -p $TEST_RESULTS_DIR
      
    - name: Detect local model prep
      run: |
        if [ -f "./setup-local-llama.sh" ]; then echo "PREP_LOCAL=true" >> $GITHUB_ENV; else echo "PREP_LOCAL=false" >> $GITHUB_ENV; fi
      
    - name: Prepare local model runtime (optional)
      if: ${{ env.PREP_LOCAL == 'true' }}
      run: |
        set -e
        ./setup-local-llama.sh || true
      
    - name: Run Feature Lab Demo Tests (Off + Hybrid Local)
      env:
        NEXO_AI_MODE: hybrid
        NEXO_PROVIDER: local
        NEXO_MODEL: llama3
      run: dotnet test tests/FeatureLab.Demo.Tests --filter "Suite=Demo" -c Release --logger "trx;LogFileName=feature-lab-demo-results.trx" --results-directory $TEST_RESULTS_DIR
      
    - name: Run cloud subset (if secret available)
      if: ${{ env.HAS_OPENAI == 'true' }}
      env:
        NEXO_AI_MODE: embedded
        NEXO_PROVIDER: openai
        NEXO_MODEL: gpt-4o
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: dotnet test tests/FeatureLab.Demo.Tests --filter "Suite=Demo&FullyQualifiedName~Parity_Local_And_Cloud" -c Release --logger "trx;LogFileName=feature-lab-cloud-results.trx" --results-directory $TEST_RESULTS_DIR
      
    - name: Run validation pass
      run: ./demo/scripts/validate-demo.sh
      
    - name: Build Feature Lab Playground
      run: |
        cd demo/feature-lab
        dotnet build -c Release
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: feature-lab-test-results
        path: $TEST_RESULTS_DIR/
        
    - name: Upload playground artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: feature-lab-playground
        path: demo/feature-lab/Playground.Server/bin/Release/net8.0/
        
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Feature Lab Demo Tests
        path: $TEST_RESULTS_DIR/*.trx
        reporter: dotnet-trx
