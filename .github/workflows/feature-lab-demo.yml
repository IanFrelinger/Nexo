name: Feature Lab Demo Readiness

on:
  push:
    branches: [ main, feat/feature-lab-demo ]
  pull_request:
    branches: [ main ]

jobs:
  feature-lab-demo:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Cache .NET packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build -c Release --no-restore
      
    - name: Seed fixtures
      run: ./demo/scripts/seed-fixtures.sh
      
    - name: Run Feature Lab Demo Tests (Off + Hybrid Local)
      env:
        NEXO_AI_MODE: hybrid
        NEXO_PROVIDER: local
        NEXO_MODEL: llama3
      run: dotnet test tests/FeatureLab.Demo.Tests --filter "Suite=Demo" -c Release --logger "trx;LogFileName=feature-lab-demo-results.trx" --results-directory TestResults
      
    - name: Run cloud subset (if secret available)
      if: ${{ secrets.OPENAI_API_KEY != '' }}
      env:
        NEXO_AI_MODE: embedded
        NEXO_PROVIDER: openai
        NEXO_MODEL: gpt-4o
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: dotnet test tests/FeatureLab.Demo.Tests --filter "Suite=Demo&FullyQualifiedName~Parity_Local_And_Cloud" -c Release --logger "trx;LogFileName=feature-lab-cloud-results.trx" --results-directory TestResults
      
    - name: Run validation pass
      run: ./demo/scripts/validate-demo.sh
      
    - name: Build Feature Lab Playground
      run: |
        cd demo/feature-lab
        dotnet build -c Release
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: feature-lab-test-results
        path: TestResults/
        
    - name: Upload playground artifacts
      uses: actions/upload-artifact@v3
      with:
        name: feature-lab-playground
        path: demo/feature-lab/Playground.Server/bin/Release/net8.0/
        
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Feature Lab Demo Tests
        path: TestResults/*.trx
        reporter: dotnet-trx
