name: MCP + A2A protocol gate

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-a2a-gate.yml"
      - "scripts/mcp-a2a-gate.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "src/Ashlar.Mcp.Server/**"
      - "src/Ashlar.Mcp.Server.Host/**"
      - "src/Ashlar.Mcp.Server.Tests/**"
      - "src/Ashlar.Mcp.Client/**"
      - "src/Ashlar.Mcp.Client.Tests/**"
      - "src/Ashlar.Transport.A2A/**"
      - "src/Ashlar.Transport.A2A.Server/**"
      - "src/Ashlar.Transport.A2A.Tests/**"
      - "src/Ashlar.Transport.A2A.Server.Tests/**"
      - "src/Ashlar.Runtime/Transport/**"
      - "src/Ashlar.Abstractions/AshlarDeploymentProfileEnvironment.cs"
      - "application/src/Ashlar.API/**"
  push:
    branches:
      - master
      - main
      - "cursor/**"
      - "application/**"   # branch-name pattern (application-tier work branches such as application/mcp-a2a), not a path
    paths:
      - ".github/workflows/mcp-a2a-gate.yml"
      - "scripts/mcp-a2a-gate.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "src/Ashlar.Mcp.Server/**"
      - "src/Ashlar.Mcp.Server.Host/**"
      - "src/Ashlar.Mcp.Server.Tests/**"
      - "src/Ashlar.Mcp.Client/**"
      - "src/Ashlar.Mcp.Client.Tests/**"
      - "src/Ashlar.Transport.A2A/**"
      - "src/Ashlar.Transport.A2A.Server/**"
      - "src/Ashlar.Transport.A2A.Tests/**"
      - "src/Ashlar.Transport.A2A.Server.Tests/**"
      - "src/Ashlar.Runtime/Transport/**"
      - "src/Ashlar.Abstractions/AshlarDeploymentProfileEnvironment.cs"
      - "application/src/Ashlar.API/**"
  workflow_dispatch:

jobs:
  protocol-adapters:
    name: MCP/A2A adapter suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 10.x builds everything (global.json) and is required for the net10-only suites
      # (TestServer + System.Text.Json 10 needs the 10.0 TestHost); 8.x keeps the net8 suites
      # on the real 8.0 runtime.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: MCP + A2A adapter suites (counted)
        shell: bash
        run: bash scripts/mcp-a2a-gate.sh adapters
        env:
          ASHLAR_ALLOW_MOCK: "1"

  protocol-prodstyle:
    name: Ashlar.API protocol endpoints (ProdStyle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: ProdStyle protocol ingress tests (counted)
        shell: bash
        run: bash scripts/mcp-a2a-gate.sh prodstyle
        env:
          ASHLAR_ALLOW_MOCK: "1"
