name: compat-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/compat-gate.yml"
      - "scripts/compat-gate*.sh"
      - "scripts/kernel-gate-tier-b.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "commercial/tests/Ashlar.Commercial.Tests.Fleet/**"
      - "commercial/src/Ashlar.Commercial.Fleet.Infrastructure/MeshTaskExecutionService.cs"
      - "src/Ashlar.Tests.Infrastructure/Tests/Pipelines/PipelineServiceCollectionExtensionsTests.cs"
      - "src/Ashlar.Tests.Infrastructure/Tests/Composition/CompositionRegistryValidationTests.cs"
      - "src/Ashlar.Tests.Infrastructure/Tests/Hosting/KernelPhaseResolutionTests.cs"
  push:
    branches: [master]
    paths:
      - ".github/workflows/compat-gate.yml"
      - "scripts/compat-gate*.sh"
      - "scripts/kernel-gate-tier-b.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "commercial/tests/Ashlar.Commercial.Tests.Fleet/**"
      - "commercial/src/Ashlar.Commercial.Fleet.Infrastructure/MeshTaskExecutionService.cs"
      - "src/Ashlar.Tests.Infrastructure/Tests/Pipelines/PipelineServiceCollectionExtensionsTests.cs"
      - "src/Ashlar.Tests.Infrastructure/Tests/Composition/CompositionRegistryValidationTests.cs"
      - "src/Ashlar.Tests.Infrastructure/Tests/Hosting/KernelPhaseResolutionTests.cs"

jobs:
  compat-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run compat gate
        run: COMPAT_GATE_SKIP_PRIOR=1 bash scripts/compat-gate.sh
