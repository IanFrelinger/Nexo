# Optional Mapbox tile integration tests (no secrets in repo).
# Set repository secrets MAPBOX_ACCESS_TOKEN and enable by dispatch or schedule.
name: Mapbox Tile Helpers (optional)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

jobs:
  mapbox-tiles:
    runs-on: ubuntu-latest
    if: ${{ secrets.MAPBOX_ACCESS_TOKEN != '' }}
    env:
      NEXO_TEST_MAPBOX_TILES: '1'
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -v minimal

      - name: Test (Mapbox external + helpers)
        run: |
          dotnet test src/Nexo.Tests.Infrastructure/Nexo.Tests.Infrastructure.csproj \
            --no-build \
            --filter "FullyQualifiedName~MapboxTilesBlackBoxTests|FullyQualifiedName~MapboxTilesWhiteBoxRealDataTests|FullyQualifiedName~MapboxWebMercatorTileMathTests|FullyQualifiedName~MapboxTileResponseValidatorsTests" \
            --logger "console;verbosity=minimal"
