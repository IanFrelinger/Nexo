name: chunk-sender-gate

on:
  push:
    paths:
      - "tools/gmail-chunk-sender/**"
      - ".github/workflows/chunk-sender-gate.yml"
  pull_request:
    paths:
      - "tools/gmail-chunk-sender/**"
      - ".github/workflows/chunk-sender-gate.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/gmail-chunk-sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .
      - name: Pytest
        run: pytest -q
      - name: Fixture plan + verify
        run: |
          python -m chunk_sender plan tests/fixtures/mini-kit/profile.yaml --to ci@example.com --no-hash
          python -m chunk_sender verify --parts-dir tests/fixtures/mini-kit/email-parts
          python -m chunk_sender send tests/fixtures/mini-kit/profile.yaml --to ci@example.com --dry-run --skip-preflight
