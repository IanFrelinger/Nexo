name: Autonomous Release Manager

on:
  pull_request:
    paths:
      - ".cursor/agents/**"
      - ".cursor/rules/release-publishing-safety.mdc"
      - ".cursor/skills/release-manager/**"
      - ".github/workflows/**"
      - ".docker/**"
      - "CHANGELOG.md"
      - "Directory.Build.*"
      - "Directory.Packages.props"
      - "Makefile"
      - "VERSION"
      - "**/*.csproj"
      - "**/*.sln"
      - "**/*.slnx"
      - "ci/autonomous-release-manager.json"
      - "ci/published-version"
      - "deploy/**"
      - "products/**"
      - "scripts/**"
      - "tests/uat/**"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate SemVer; must match the root VERSION file (blank = VERSION)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: autonomous-release-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release manager
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit-test coordinator
        run: python3 -m unittest discover -s scripts/tests -p "test_autonomous_release_manager.py" -v

      - name: Validate immutable audit plan
        run: python3 scripts/autonomous-release-manager.py --validate-only

      - name: Write validation failure evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p .ashlar/release-manager/validation
          cat > .ashlar/release-manager/validation/report.json <<JSON
          {
            "schemaVersion": 1,
            "headSha": "${GITHUB_SHA}",
            "verdict": "blocked",
            "reason": "Release-manager unit tests or plan validation failed before audit."
          }
          JSON
          cat > .ashlar/release-manager/validation/report.md <<MARKDOWN
          # Autonomous Release Manager

          **BLOCKED:** coordinator tests or plan validation failed on \`${GITHUB_SHA}\`.
          MARKDOWN

      - name: Upload validation failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manager-validation-${{ github.sha }}-${{ github.run_id }}
          path: .ashlar/release-manager/validation/
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Six-lane release audit
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Run release audit sub-agents
        id: audit
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set +e
          args=(
            --plan ci/autonomous-release-manager.json
            --output .ashlar/release-manager/current
          )
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            args+=(--version "${REQUESTED_VERSION}")
          fi
          python3 scripts/autonomous-release-manager.py "${args[@]}"
          rc=$?
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Ensure failure evidence exists
        if: always()
        shell: bash
        run: |
          if [[ ! -f .ashlar/release-manager/current/report.json ]]; then
            mkdir -p .ashlar/release-manager/current
            cat > .ashlar/release-manager/current/report.json <<JSON
          {
            "schemaVersion": 1,
            "headSha": "${GITHUB_SHA}",
            "verdict": "blocked",
            "reason": "Coordinator terminated without a complete report."
          }
          JSON
            cat > .ashlar/release-manager/current/report.md <<MARKDOWN
          # Autonomous Release Manager

          **BLOCKED:** coordinator terminated without a complete report on \`${GITHUB_SHA}\`.
          MARKDOWN
          fi

      - name: Publish release verdict to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f .ashlar/release-manager/current/report.md ]]; then
            cat .ashlar/release-manager/current/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Autonomous Release Manager" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**BLOCKED:** coordinator produced no report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload auditable release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manager-${{ github.sha }}-${{ github.run_id }}
          path: |
            .ashlar/release-manager/current/
            .ashlar/release-manager/latest.json
            .ashlar/release-manager/latest.md
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Finalize interrupted audit
    needs: [validate, audit]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.audit.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record terminal workflow state
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          mkdir -p release-manager-terminal
          cat > release-manager-terminal/report.json <<JSON
          {
            "schemaVersion": 1,
            "headSha": "${GITHUB_SHA}",
            "verdict": "blocked",
            "validateJob": "${VALIDATE_RESULT}",
            "auditJob": "${AUDIT_RESULT}",
            "reason": "The audit job did not complete successfully; inspect its primary evidence artifact when present."
          }
          JSON
          cat > release-manager-terminal/report.md <<MARKDOWN
          # Autonomous Release Manager

          **BLOCKED:** validate=\`${VALIDATE_RESULT}\`, audit=\`${AUDIT_RESULT}\`
          on \`${GITHUB_SHA}\`.
          MARKDOWN

      - name: Upload terminal failure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manager-terminal-${{ github.sha }}-${{ github.run_id }}
          path: release-manager-terminal/
          if-no-files-found: error
          retention-days: 30
