# Isolated MAUI client compile — does not run full solution test matrix.
# Windows: WinUI target. macOS: Mac Catalyst (no Apple signing required for compile-only).
name: MAUI Client Build Gate

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/maui-client-build-gate.yml'
      - 'src/Nexo.Client.Mobile/**'
      - 'src/Nexo.Client/**'
      - 'src/Nexo.Contracts/**'

jobs:
  maui-windows:
    name: MAUI Windows target
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-sign-check

      - name: Restore mobile project
        run: dotnet restore src/Nexo.Client.Mobile/Nexo.Client.Mobile.csproj

      - name: Build (net8.0-windows)
        run: dotnet build src/Nexo.Client.Mobile/Nexo.Client.Mobile.csproj --no-restore -f net8.0-windows10.0.19041.0 -v minimal

  maui-maccatalyst:
    name: MAUI Mac Catalyst target
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-sign-check

      - name: Restore mobile project
        run: dotnet restore src/Nexo.Client.Mobile/Nexo.Client.Mobile.csproj

      - name: Build (net8.0-maccatalyst)
        run: dotnet build src/Nexo.Client.Mobile/Nexo.Client.Mobile.csproj --no-restore -f net8.0-maccatalyst -v minimal
