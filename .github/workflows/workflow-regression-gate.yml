# Path-filtered PR/push plus dispatch. Last green dispatch 2026-06-14; now the
# automatic lane for `ashlar workflow baseline promote|report|gate`.
name: Workflow Regression Gate

on:
  pull_request:
    paths:
      - '.github/workflows/workflow-regression-gate.yml'
      - 'scripts/workflow-regression-gate.sh'
      - 'scripts/lib/assert-test-local-floor.py'
      - 'application/src/Ashlar.CLI/**'
      - 'application/src/Ashlar.Tests.CLI/**'
      - 'src/Ashlar.Tests.Infrastructure/scripts/copy-assemblies.csproj'
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - '.github/workflows/workflow-regression-gate.yml'
      - 'scripts/workflow-regression-gate.sh'
      - 'scripts/lib/assert-test-local-floor.py'
      - 'application/src/Ashlar.CLI/**'
      - 'application/src/Ashlar.Tests.CLI/**'
      - 'src/Ashlar.Tests.Infrastructure/scripts/copy-assemblies.csproj'
  workflow_dispatch:

jobs:
  workflow-regression:
    name: Workflow benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Run workflow regression gate
        shell: bash
        run: bash scripts/workflow-regression-gate.sh

      - name: Upload workflow gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-regression-gate
          path: |
            .ashlar/runtime/workflow_lab_history.jsonl
            .ashlar/runtime/workflow_lab_baselines.json
          retention-days: 14
