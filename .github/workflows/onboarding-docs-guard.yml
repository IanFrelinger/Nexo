name: onboarding-docs-guard

on:
  push:
    branches: [ master, main, "cursor/**" ]
    paths:
      - 'README.md'
      - 'docs/GettingStarted.md'
      - 'docs/DocsIndex.md'
      - '.github/workflows/onboarding-docs-guard.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/GettingStarted.md'
      - 'docs/DocsIndex.md'
      - '.github/workflows/onboarding-docs-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure onboarding has two-lane quickstart and workload-safe defaults
        shell: bash
        run: |
          set -euo pipefail

          # README must include the two-lane framing and concrete commands.
          rg -n "## Quick Start \\(5 minutes\\)" README.md
          rg -n "Choose your lane \\(recommended\\)" README.md
          rg -n "Lane A: fastest path \\(container runtime\\)" README.md
          rg -n "Lane B: full local dev path \\(native SDK\\)" README.md
          rg -n "docker run --rm ghcr.io/ianfrelinger/nexo-cli:latest --help" README.md
          rg -n "bash scripts/setup/setup\.sh all" README.md
          rg -n "dotnet build src/Nexo\.CLI/Nexo\.CLI\.csproj --no-restore" README.md

          # Guard against heavy first-step solution build instructions.
          if rg -n "dotnet build Nexo\.sln" README.md >/dev/null 2>&1; then
            echo "README.md should not recommend 'dotnet build Nexo.sln' in onboarding paths."
            exit 1
          fi

          # GettingStarted should reflect same workload-safe baseline + container lane.
          rg -n "Fastest path \(container-first\)" docs/GettingStarted.md
          rg -n "docker run --rm ghcr.io/ianfrelinger/nexo-cli:latest --help" docs/GettingStarted.md
          rg -n "bash scripts/setup/setup\.sh all" docs/GettingStarted.md
          rg -n "dotnet build src/Nexo\.CLI/Nexo\.CLI\.csproj --no-restore" docs/GettingStarted.md

          if rg -n "dotnet build Nexo\.sln" docs/GettingStarted.md >/dev/null 2>&1; then
            echo "docs/GettingStarted.md should not recommend 'dotnet build Nexo.sln' in onboarding paths."
            exit 1
          fi

          # Docs index must route users to onboarding and setup scripts.
          rg -n "README\.md" docs/DocsIndex.md
          rg -n "docs/GettingStarted\.md" docs/DocsIndex.md
          rg -n "scripts/setup/setup\.sh" docs/DocsIndex.md
          rg -n "scripts/setup/setup\.ps1" docs/DocsIndex.md

      - name: Emit onboarding docs guard summary
        if: always()
        shell: bash
        run: |
          SUMMARY_FILE="${RUNNER_TEMP}/onboarding-docs-guard-summary.txt"
          {
            echo "onboarding-docs-guard summary"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "status=completed"
          } > "${SUMMARY_FILE}"

      - name: Upload onboarding docs guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-docs-guard
          path: |
            ${{ runner.temp }}/onboarding-docs-guard-summary.txt
          retention-days: 14
