name: Onboarding Docs Guard

on:
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - "README.md"
      - "docs/GettingStarted.md"
      - "docs/DocsIndex.md"
      - "docs/OneClickInstall.md"
      - ".github/workflows/onboarding-docs-guard.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/GettingStarted.md"
      - "docs/DocsIndex.md"
      - "docs/OneClickInstall.md"
      - ".github/workflows/onboarding-docs-guard.yml"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure onboarding has workload-safe startup defaults
        shell: bash
        run: |
          set -euo pipefail

          # README must include lane-based onboarding and safe build path.
          rg -n "## Quick Start \(5 minutes\)" README.md
          rg -n "Choose your lane \(recommended\)" README.md
          rg -n "Lane A: fastest path \(container runtime\)" README.md
          rg -n "Lane B: full local dev path \(native SDK\)" README.md
          rg -n "scripts/install/install\.sh --yes" README.md
          rg -n "dotnet build src/Nexo\.CLI/Nexo\.CLI\.csproj --no-restore" README.md

          if rg -n "dotnet build Nexo\.sln" README.md >/dev/null 2>&1; then
            echo "README.md should not recommend 'dotnet build Nexo.sln' in onboarding paths."
            exit 1
          fi

          # GettingStarted should include lane + install wrappers + doctor.
          rg -n "Lane A \(fastest\): container-first" docs/GettingStarted.md
          rg -n "scripts/install/install\.sh --yes" docs/GettingStarted.md
          rg -n "dotnet run --project src/Nexo.CLI -- doctor --json" docs/GettingStarted.md
          rg -n "dotnet build src/Nexo\.CLI/Nexo\.CLI\.csproj --no-restore" docs/GettingStarted.md

          if rg -n "^dotnet build Nexo\.sln$" docs/GettingStarted.md >/dev/null 2>&1; then
            echo "docs/GettingStarted.md should not include 'dotnet build Nexo.sln' as a runnable command."
            exit 1
          fi

          # OneClickInstall must include platform wrappers.
          rg -n "scripts/install/install\.sh" docs/OneClickInstall.md
          rg -n "scripts/install/install\.ps1" docs/OneClickInstall.md

          # Docs index must route users correctly.
          rg -n "docs/GettingStarted\.md" docs/DocsIndex.md
          rg -n "scripts/setup/setup\.sh" docs/DocsIndex.md
          rg -n "onboarding-quickstart-gate\.yml" docs/DocsIndex.md

      - name: Emit onboarding docs guard summary
        if: always()
        shell: bash
        run: |
          SUMMARY_FILE="${RUNNER_TEMP}/onboarding-docs-guard-summary.txt"
          {
            echo "onboarding-docs-guard summary"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "status=completed"
          } > "${SUMMARY_FILE}"

      - name: Upload onboarding docs guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-docs-guard
          path: |
            ${{ runner.temp }}/onboarding-docs-guard-summary.txt
          retention-days: 14
