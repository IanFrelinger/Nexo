name: Onboarding Docs Guard

on:
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - "README.md"
      - "docs/GettingStarted.md"
      - "docs/DocsIndex.md"
      - "docs/DEPLOYMENT.md"
      - "docs/PUBLISHING.md"
      - "docs/RELEASE_RUNBOOK.md"
      - "docs/CiFirstHardwareSecond.md"
      - ".devcontainer/**"
      - ".github/workflows/onboarding-docs-guard.yml"
      # Referenced-path guard inputs (see "Referenced repo paths must exist" below).
      - "docs/**/*.md"
      - "scripts/*.sh"
      - "scripts/*.ps1"
      - "Makefile"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure onboarding has workload-safe startup defaults
        shell: bash
        run: |
          set -euo pipefail

          # README must include lane-based onboarding and safe build path.
          grep -nE "## Quick Start \\(5 minutes\\)" README.md
          grep -nE "### Lane 1 .* Try \\(run the portal\\)" README.md
          grep -nE "### Lane 2 .* Develop \\(dev container \\+ CLI\\)" README.md
          grep -nE "### Lane 3 .* Deploy \\(operators\\)" README.md
          grep -nE "bash scripts/setup/setup\\.sh all" README.md
          grep -nE "dotnet build application/src/Nexo\\.CLI/Nexo\\.CLI\\.csproj --no-restore" README.md

          if grep -nE "dotnet build Nexo\\.sln" README.md >/dev/null 2>&1; then
            echo "README.md should not recommend 'dotnet build Nexo.sln' in onboarding paths."
            exit 1
          fi

          # GettingStarted should include lane + setup + doctor.
          grep -nE "Lane A \\(fastest\\): container-first" docs/GettingStarted.md
          grep -nE "bash scripts/setup/setup\\.sh all" docs/GettingStarted.md
          grep -nE "dotnet run --project application/src/Nexo\\.CLI -- doctor --json" docs/GettingStarted.md
          grep -nE "dotnet build application/src/Nexo\\.CLI/Nexo\\.CLI\\.csproj --no-restore" docs/GettingStarted.md

          if grep -nE "^dotnet build Nexo\\.sln$" docs/GettingStarted.md >/dev/null 2>&1; then
            echo "docs/GettingStarted.md should not include 'dotnet build Nexo.sln' as a runnable command."
            exit 1
          fi

          # Docs index must route users correctly.
          grep -nE "docs/GettingStarted\\.md" docs/DocsIndex.md
          grep -nE "scripts/setup/setup\\.sh" docs/DocsIndex.md
          grep -nE "onboarding-quickstart-gate\\.yml" docs/DocsIndex.md
          grep -nE "devcontainer-gate\\.yml" docs/DocsIndex.md
          grep -nE "docs/RELEASE_RUNBOOK\\.md" docs/DocsIndex.md
          grep -nE "pack-hosting-graph-alignment\\.yml" docs/DocsIndex.md

          # Operator deploy section stays container-first.
          grep -nE "## Deploy \\(operators\\)" README.md
          grep -nE "docs/CiFirstHardwareSecond\\.md" README.md

      # lychee (docs-link-check) only follows Markdown links; inline-code repo paths such as
      # `scripts/foo.sh` are invisible to it. Commit 0bcc2718 deleted scripts/nexo-ready-gate.sh,
      # scripts/start|stop-nexo-api-dev.{sh,ps1} and docs/production-readiness/README.md while
      # ~20 docs, the Makefile and run-ollama-docker.* kept pointing at them. This step fails when
      # a backtick-quoted repo path in README/docs/scripts/Makefile does not exist in the checkout.
      - name: Referenced repo paths must exist
        shell: bash
        run: |
          set -euo pipefail

          files=(README.md Makefile)
          while IFS= read -r f; do files+=("$f"); done < <(find docs -type f -name '*.md' | sort)
          while IFS= read -r f; do files+=("$f"); done < <(find scripts -maxdepth 1 -type f \( -name '*.sh' -o -name '*.ps1' \) | sort)

          pattern='`(scripts|docs|deploy|\.github|src|application|applications|samples)/[A-Za-z0-9._/-]+\.(sh|ps1|md|yml|yaml|json|csproj|sln|slnf)`'
          missing=0
          while IFS= read -r token; do
            path="${token#\`}"; path="${path%\`}"
            # Placeholders such as `scripts/<name>.sh` or `docs/{a,b}.md` are not real paths.
            case "$path" in *'<'*|*'{'*) continue ;; esac
            if [ ! -e "$path" ]; then
              echo "::error::referenced path does not exist: $path"
              grep -lF -- "$token" "${files[@]}" | sed 's/^/    referenced by: /'
              missing=$((missing + 1))
            fi
          done < <(grep -ohE -- "$pattern" "${files[@]}" | sort -u)

          echo "referenced-path guard: ${missing} missing path(s)"
          [ "$missing" -eq 0 ]

      - name: Emit onboarding docs guard summary
        if: always()
        shell: bash
        run: |
          SUMMARY_FILE="${RUNNER_TEMP}/onboarding-docs-guard-summary.txt"
          {
            echo "onboarding-docs-guard summary"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "status=completed"
          } > "${SUMMARY_FILE}"

      - name: Upload onboarding docs guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-docs-guard
          path: |
            ${{ runner.temp }}/onboarding-docs-guard-summary.txt
          retention-days: 14
