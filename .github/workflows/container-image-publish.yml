name: Container Image Publish

on:
  workflow_dispatch:
    inputs:
      skip_multi_arch:
        description: "Skip linux/arm64 multi-arch build (faster; amd64 only for latest on main)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/container-image-publish.yml"
      - ".docker/**"
      - ".dockerignore"
      - "src/Nexo.CLI/**"
      - "src/Nexo.API/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Hosting/**"
      - "src/Nexo.Runtime/**"
      - "src/Nexo.Abstractions/**"
      - "src/Nexo.Core/**"
      - "src/Nexo.Core.Domain/**"
      - "src/Nexo.Brick.Contracts/**"
      - "src/Nexo.Orchestration/**"
      - "src/Nexo.BackgroundAgents/**"
      - "src/Nexo.Transport.Grpc/**"
      - "src/Nexo.Policies/**"
      - "src/Nexo.Tools.Assembly/**"
      - "src/Nexo.Tools.Dev/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-cli:
    name: GHCR nexo-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/nexo-cli"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "SHA_TAG=${SHA_TAG}" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            echo "SEMVER_TAG=${IMAGE}:${SEMVER}" >> "${GITHUB_ENV}"
            echo "Also tagging semver: ${SEMVER}"
          else
            echo "SEMVER_TAG=" >> "${GITHUB_ENV}"
          fi

      - name: Build and push linux/amd64 (immutable sha tag)
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --platform linux/amd64 \
            --tag "${SHA_TAG}" \
            --push \
            .

      - name: Smoke test published image
        shell: bash
        run: |
          docker run --rm "${SHA_TAG}" --help

      - name: Publish latest (amd64 + arm64) on main
        if: >-
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
          && (github.event_name != 'workflow_dispatch' || inputs.skip_multi_arch == false)
        timeout-minutes: 35
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Publish latest (amd64 only) when multi-arch skipped
        if: >-
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
          && github.event_name == 'workflow_dispatch'
          && inputs.skip_multi_arch == true
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --platform linux/amd64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Tag semver on release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --platform linux/amd64 \
            --tag "${SEMVER_TAG}" \
            --push \
            .

  publish-api:
    name: GHCR nexo-api
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/nexo-api"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "SHA_TAG=${SHA_TAG}" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            echo "SEMVER_TAG=${IMAGE}:${SEMVER}" >> "${GITHUB_ENV}"
          else
            echo "SEMVER_TAG=" >> "${GITHUB_ENV}"
          fi

      - name: Build and push linux/amd64 (immutable sha tag)
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.api \
            --platform linux/amd64 \
            --tag "${SHA_TAG}" \
            --push \
            .

      - name: Publish latest on main
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.api \
            --platform linux/amd64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Tag semver on release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.api \
            --platform linux/amd64 \
            --tag "${SEMVER_TAG}" \
            --push \
            .
