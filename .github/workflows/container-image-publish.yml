# Publishes GHCR images on pushes to main (path-filtered) or manual dispatch.
# Release tags (v*.*.*) use **release.yml** so images + NuGet run once.

name: Container Image Publish

on:
  workflow_dispatch:
    inputs:
      skip_multi_arch:
        description: "Skip linux/arm64 for nexo-cli :latest (amd64 only)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/container-image-publish.yml"
      - ".github/workflows/reusable-container-publish.yml"
      - ".docker/**"
      - ".dockerignore"
      - "application/src/Ashlar.CLI/**"
      - "application/src/Ashlar.API/**"
      - "src/Ashlar.Core.Application/**"
      - "src/Ashlar.Infrastructure/**"
      - "src/Ashlar.Hosting/**"
      - "src/Ashlar.Runtime/**"
      - "src/Ashlar.Abstractions/**"
      - "src/Ashlar.Core.Domain/**"
      - "src/Ashlar.Brick.Contracts/**"
      - "src/Ashlar.Orchestration/**"
      - "src/Ashlar.BackgroundAgents/**"
      - "src/Ashlar.Transport.Grpc/**"
      - "src/Ashlar.Policies/**"
      - "src/Ashlar.Tools.Assembly/**"
      - "src/Ashlar.Tools.Dev/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Forks: a push to master would otherwise try to publish nexo-cli / nexo-api to the
    # fork's own GHCR namespace. Only the upstream owner publishes (see docs/CiSecrets.md).
    if: github.repository_owner == 'IanFrelinger'
    uses: ./.github/workflows/reusable-container-publish.yml
    secrets: inherit
    with:
      skip_multi_arch: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_multi_arch || false }}
