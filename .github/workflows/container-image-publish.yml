# Publishes GHCR images on manual dispatch. Release tags (v*.*.*) use **release.yml**.

name: Container Image Publish

on:
  workflow_dispatch:
    inputs:
      skip_multi_arch:
        description: "Skip linux/arm64 for nexo-cli :latest (amd64 only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/reusable-container-publish.yml
    secrets: inherit
    with:
      skip_multi_arch: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_multi_arch || false }}
