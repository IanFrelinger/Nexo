# Ship gate: production readiness + ci verify + release preflight.
# See docs/production-readiness/ShipHardeningPlan-v1.md
name: Ship Gate

on:
  pull_request:
    paths:
      - ".github/workflows/ship-gate.yml"
      - "scripts/ship-gate-tier-b.sh"
      - "scripts/ship-gate-tier-c.sh"
      - "scripts/ship-gate-tier-d.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "src/Ashlar.Tests.Infrastructure/Tests/BaseFramework/**"
  workflow_dispatch:
    inputs:
      tier:
        description: "Gate tier"
        required: false
        default: "a"
        type: choice
        options:
          - a
          - b
          - c
          - d
          - full

jobs:
  ship-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Tier A (production readiness CLI)
        if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'a' || inputs.tier == 'full')
        run: make ship-gate-tier-a
        env:
          ASHLAR_ALLOW_MOCK: "1"

      # Same `!=` form as Application / Kernel B so pull_request runs the
      # counted BaseFrameworkSmoke slice. A stays dispatch-only
      # (also covered by production-readiness-gate-v1 on PRs).
      - name: Tier B (ProdStyle + smoke + doctor)
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'b' || inputs.tier == 'full'
        run: make ship-gate-tier-b
        env:
          ASHLAR_ALLOW_MOCK: "1"
          SHIP_GATE_STRICT_DOCTOR: "1"

      # Same `!=` form as Tier B so pull_request runs pack + NuGet consume.
      - name: Tier C (release preflight)
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'c' || inputs.tier == 'full'
        run: make ship-gate-tier-c

      # Same `!=` form as Tier B so pull_request actually runs the release
      # bundle. D used to be dispatch-only after the bundle became mandatory.
      - name: Tier D (release bundle)
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'd' || inputs.tier == 'full'
        run: make ship-gate-tier-d
        env:
          ASHLAR_ALLOW_MOCK: "1"
