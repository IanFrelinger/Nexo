name: Test Caching Multi-Environment

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/Nexo.Adapters.GeoTerrain/**'
      - 'src/Nexo.Adapters.GeoVector/**'
      - 'src/Nexo.Tests.GeospatialUnit/**'
      - 'src/Nexo.Tests.GeospatialE2E/**'
      - 'src/Nexo.Tests.Infrastructure/**'
      - '.docker/Dockerfile.test-caching*'
      - 'scripts/test-caching-multi-env.sh'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'src/Nexo.Adapters.GeoTerrain/**'
      - 'src/Nexo.Adapters.GeoVector/**'
      - 'src/Nexo.Tests.GeospatialUnit/**'
      - 'src/Nexo.Tests.GeospatialE2E/**'
      - 'src/Nexo.Tests.Infrastructure/**'
      - '.docker/Dockerfile.test-caching*'
      - 'scripts/test-caching-multi-env.sh'
  workflow_dispatch:

jobs:
  test-caching:
    name: Caching Tests - ${{ matrix.environment.name }}
    runs-on: ${{ matrix.environment.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - name: ubuntu-8.0
            dockerfile: .docker/Dockerfile.test-caching
            dotnet: 8.0
            type: docker
          - name: ubuntu-7.0
            dockerfile: .docker/Dockerfile.test-caching
            dotnet: 7.0
            type: docker
          - name: alpine-8.0
            dockerfile: .docker/Dockerfile.test-caching-alpine
            dotnet: 8.0
            type: docker
          - name: debian-8.0
            dockerfile: .docker/Dockerfile.test-caching-debian
            dotnet: 8.0
            type: docker
          - name: android-8.0
            dockerfile: .docker/Dockerfile.test-caching-android
            dotnet: 8.0
            type: docker
          - name: windows-8.0
            dockerfile: .docker/Dockerfile.test-caching-windows
            dotnet: 8.0
            type: docker
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: matrix.environment.type == 'docker'
        run: |
          docker build \
            -f ${{ matrix.environment.dockerfile }} \
            --build-arg DOTNET_VERSION=${{ matrix.environment.dotnet }} \
            -t nexo-caching-test:${{ matrix.environment.name }} \
            .

      - name: Run Base Framework Tests (Docker)
        if: matrix.environment.type == 'docker'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/test-results:/workspace/test-results \
            nexo-caching-test:${{ matrix.environment.name }} \
            bash -c "
              dotnet test src/Nexo.Tests.Infrastructure/Nexo.Tests.Infrastructure.csproj \
                --filter 'FullyQualifiedName~BaseFrameworkSmokeTests' \
                --logger 'console;verbosity=minimal' \
                --logger 'trx;LogFileName=${{ matrix.environment.name }}-base.trx' \
                --results-directory /workspace/test-results
            "

      - name: Run Geospatial Application Tests (Docker)
        if: matrix.environment.type == 'docker'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/test-results:/workspace/test-results \
            nexo-caching-test:${{ matrix.environment.name }} \
            bash -c "
              dotnet test src/Nexo.Tests.GeospatialE2E/Nexo.Tests.GeospatialE2E.csproj \
                --filter 'FullyQualifiedName~GeospatialE2ESmokeTests' \
                --logger 'console;verbosity=minimal' \
                --logger 'trx;LogFileName=${{ matrix.environment.name }}-geo.trx' \
                --results-directory /workspace/test-results
            "

      - name: Run Base Framework Tests (Native)
        if: matrix.environment.type == 'native'
        run: |
          chmod +x scripts/test-caching-${{ matrix.environment.name }}.sh
          ./scripts/test-caching-${{ matrix.environment.name }}.sh || true

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            test-results/**/*.trx
            test-results/caching/**/*.trx
          check_name: Caching Tests - ${{ matrix.environment.name }}
          comment_mode: create new
          report_individual_runs: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.environment.name }}
          path: test-results/**/*.trx
          retention-days: 30

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test-caching
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "All caching tests completed across all environments"
          echo "Check individual job results for details"
