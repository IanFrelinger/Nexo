name: Commit Lint

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        # Note: cache disabled because this project doesn't use npm/yarn
        # If you add commitlint dependencies, add package.json and enable cache

    - name: Install commitlint
      run: |
        # Install commitlint globally or use npx (no package.json needed)
        npm install -g @commitlint/cli @commitlint/config-conventional || true

    - name: Validate commit messages
      run: |
        # Validate all commits in the PR
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose
        else
          # For push events, validate the last commit
          npx commitlint --from HEAD~1 --to HEAD --verbose
        fi

    - name: Validate PR title
      if: github.event_name == 'pull_request'
      run: |
        echo "${{ github.event.pull_request.title }}" | npx commitlint --stdin
