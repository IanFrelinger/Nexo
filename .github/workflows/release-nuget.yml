# NuGet-only release (manual). For tags + images together, use **release.yml**.
# Both entry points require a READY autonomous-release-manager verdict first.

name: Release NuGet packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v prefix (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release-ready:
    name: Release-manager READY
    if: github.repository_owner == 'IanFrelinger'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Require READY verdict for this SHA
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bash scripts/require-release-manager-ready.sh "${REQUESTED_VERSION}" .ashlar/release-manager/current

      - name: Upload release-manager evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manager-${{ github.sha }}-${{ github.run_id }}
          path: |
            .ashlar/release-manager/current/
            .ashlar/release-manager/latest.json
            .ashlar/release-manager/latest.md
          if-no-files-found: error
          retention-days: 30

  nuget:
    # Forks: without NUGET_PUBLISH_MODE this is artifact-only, but the guard keeps a fork from
    # ever reaching the nuget.org push steps by accident (docs/CiSecrets.md).
    if: github.repository_owner == 'IanFrelinger'
    needs: [release-ready]
    uses: ./.github/workflows/reusable-release-nuget.yml
    secrets: inherit
    with:
      package_version: ${{ inputs.version }}

  verify-nuget-consumer:
    name: Verify NuGet consumer (nuget.org)
    needs: [release-ready, nuget]
    if: success() && (vars.NUGET_PUBLISH_MODE == 'oidc' || vars.NUGET_PUBLISH_MODE == 'apikey')
    uses: ./.github/workflows/reusable-verify-nuget-consumer.yml
    with:
      package_version: ${{ inputs.version }}
