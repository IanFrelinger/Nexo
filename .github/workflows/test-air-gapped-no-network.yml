# Air-gapped multi-env: run tests with --network none to validate no network access.
# Proves tests pass in air-gapped deployment. Run from CI or manually.
name: Air-Gapped Multi-Env Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite'
        required: true
        default: 'framework'
        type: choice
        options:
          - framework
          - caching
          - trust
          - adaptation

jobs:
  air-gapped:
    name: Air-gapped (${{ github.event.inputs.suite || 'framework' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore Nexo.sln

      - name: Build
        run: dotnet build Nexo.sln --no-restore -v minimal

      - name: Run multi-env with --no-network
        run: |
          dotnet run --project application/src/Nexo.CLI -- test multi-env --suite ${{ github.event.inputs.suite || 'framework' }} --env ubuntu-8.0 --no-network
