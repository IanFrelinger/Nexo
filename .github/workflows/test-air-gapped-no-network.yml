# Air-gapped multi-env: run tests with --network none to validate no network access.
# Proves tests pass in air-gapped deployment. Run from CI or manually.
name: Air-Gapped Multi-Env Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite'
        required: true
        default: 'framework'
        type: choice
        options:
          - framework
          - caching
          - trust
          - adaptation
  schedule:
    # Weekly on Sunday 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  air-gapped:
    name: Air-gapped (${{ github.event.inputs.suite || 'framework' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -v minimal

      - name: Run multi-env with --no-network
        run: |
          dotnet run --project src/Nexo.CLI -- test multi-env --suite ${{ github.event.inputs.suite || 'framework' }} --env ubuntu-8.0 --no-network
