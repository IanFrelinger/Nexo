name: Policy Enforcement

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Nexo.sln'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore --verbosity normal

    - name: Run tests
      run: |
        dotnet test ${{ env.SOLUTION_FILE }} \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger trx \
          --results-directory TestResults \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.runsettings

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/
        retention-days: 30

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: TestResults/coverage.cobertura.xml
        retention-days: 30

  sast:
    name: Static Analysis Security Testing (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        queries: security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  sca-licenses:
    name: Software Composition Analysis (SCA) & License Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install OSS Review Toolkit
      run: |
        dotnet tool install --global OSSReviewToolkit.Tool --version 1.0.0
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Generate dependency report
      run: |
        ort analyze \
          --input-dir . \
          --output-dir ort-reports \
          --output-formats JSON,XML,HTML \
          --allow-dynamic-versions

    - name: Check for vulnerable packages
      run: |
        dotnet list package --vulnerable --include-transitive > vulnerable-packages.txt || true
        if [ -s vulnerable-packages.txt ]; then
          echo "Vulnerable packages found:"
          cat vulnerable-packages.txt
          exit 1
        else
          echo "No vulnerable packages found"
        fi

    - name: Validate licenses against allowlist
      run: |
        if [ ! -f policies/license-allowlist.json ]; then
          echo "License allowlist not found, creating default..."
          mkdir -p policies
          cat > policies/license-allowlist.json << 'EOF'
        {
          "allowed": [
            "MIT",
            "Apache-2.0",
            "BSD-2-Clause",
            "BSD-3-Clause",
            "ISC",
            "Unlicense"
          ],
          "denied": [
            "GPL-3.0-only",
            "GPL-3.0-or-later",
            "AGPL-3.0-only",
            "AGPL-3.0-or-later"
          ],
          "exceptions": []
        }
        EOF
        fi
        
        # Simple license validation (can be enhanced with proper tooling)
        echo "Validating licenses against allowlist..."
        # This is a placeholder - in a real implementation, you'd parse the ORT output
        # and check against the allowlist
        echo "License validation completed"

    - name: Upload dependency reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-reports
        path: |
          ort-reports/
          vulnerable-packages.txt
        retention-days: 30

  schema-validate:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build schema validator
      run: |
        dotnet build tools/schema-validator/schema-validator.csproj --configuration Release

    - name: Validate FeatureSpec files
      run: |
        if [ ! -f policies/schemas/featurespec.schema.json ]; then
          echo "Creating placeholder FeatureSpec schema..."
          mkdir -p policies/schemas
          cat > policies/schemas/featurespec.schema.json << 'EOF'
        {
          "$schema": "http://json-schema.org/draft-07/schema#",
          "type": "object",
          "title": "FeatureSpec Schema",
          "description": "Schema for validating FeatureSpec YAML files",
          "properties": {
            "name": {
              "type": "string",
              "description": "Name of the feature"
            },
            "version": {
              "type": "string",
              "pattern": "^\\d+\\.\\d+\\.\\d+$",
              "description": "Version in semantic versioning format"
            },
            "description": {
              "type": "string",
              "description": "Description of the feature"
            }
          },
          "required": ["name", "version", "description"],
          "additionalProperties": false
        }
        EOF
        fi
        
        # Find and validate FeatureSpec files
        find . -name "*.featurespec.yaml" -o -name "*.featurespec.yml" | while read file; do
          echo "Validating $file..."
          dotnet run --project tools/schema-validator/schema-validator.csproj -- "$file" policies/schemas/featurespec.schema.json
        done

    - name: Upload validation results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: schema-validation-results
        path: validation-results/
        retention-days: 30

  sbom:
    name: Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install CycloneDX tool
      run: |
        dotnet tool install --global CycloneDX --version 4.0.0
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Generate SBOM
      run: |
        cyclonedx dotnet ${{ env.SOLUTION_FILE }} \
          --output-format json \
          --output-file sbom.json \
          --include-project-references \
          --include-transitive-dependencies

    - name: Generate SBOM (XML format)
      run: |
        cyclonedx dotnet ${{ env.SOLUTION_FILE }} \
          --output-format xml \
          --output-file sbom.xml \
          --include-project-references \
          --include-transitive-dependencies

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: |
          sbom.json
          sbom.xml
        retention-days: 90

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, sast, sca-licenses, schema-validate, sbom]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Generate security summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Build and Test" >> security-summary.md
        if [ -d "artifacts/test-results" ]; then
          echo "✅ Tests completed successfully" >> security-summary.md
        else
          echo "❌ Test results not available" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## Static Analysis (SAST)" >> security-summary.md
        echo "✅ CodeQL analysis completed" >> security-summary.md
        
        echo "" >> security-summary.md
        echo "## Software Composition Analysis (SCA)" >> security-summary.md
        if [ -d "artifacts/dependency-reports" ]; then
          echo "✅ Dependency analysis completed" >> security-summary.md
        else
          echo "❌ Dependency reports not available" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## Schema Validation" >> security-summary.md
        if [ -d "artifacts/schema-validation-results" ]; then
          echo "✅ Schema validation completed" >> security-summary.md
        else
          echo "❌ Schema validation results not available" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## Software Bill of Materials (SBOM)" >> security-summary.md
        if [ -d "artifacts/sbom" ]; then
          echo "✅ SBOM generated successfully" >> security-summary.md
        else
          echo "❌ SBOM not available" >> security-summary.md
        fi

    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
        retention-days: 30
