name: Director Studio (Avalonia) Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tools/Director.Core/**'
      - 'tools/Director.Avalonia/**'
      - '.github/workflows/director-avalonia-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tools/Director.Core/**'
      - 'tools/Director.Avalonia/**'
      - '.github/workflows/director-avalonia-build.yml'

jobs:
  build-core:
    name: Build Director.Core
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore tools/Director.Core/Director.Core.csproj
      
    - name: Build
      run: dotnet build tools/Director.Core/Director.Core.csproj --configuration Release --no-restore
      
    - name: Test
      run: dotnet test tools/Director.Core/Director.Core.csproj --configuration Release --no-build --verbosity normal
      
    - name: Pack
      run: dotnet pack tools/Director.Core/Director.Core.csproj --configuration Release --no-build --output ./nupkgs

  build-avalonia:
    name: Build Director.Avalonia
    runs-on: ${{ matrix.os }}
    needs: build-core
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore tools/Director.Avalonia/Director.Avalonia.csproj
      
    - name: Build
      run: dotnet build tools/Director.Avalonia/Director.Avalonia.csproj --configuration Release --no-restore
      
    - name: Test
      run: dotnet test tools/Director.Avalonia/Director.Avalonia.csproj --configuration Release --no-build --verbosity normal
      
    - name: Publish
      run: dotnet publish tools/Director.Avalonia/Director.Avalonia.csproj --configuration Release --no-build --output ./publish --self-contained false

  build-unity-package:
    name: Build Unity Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate package.json
      run: |
        echo "Validating Unity package structure..."
        test -f Packages/com.nexo.director/package.json
        test -f Packages/com.nexo.director/Editor/Director.asmdef
        test -f Packages/com.nexo.director/Runtime/Director.asmdef
        echo "Package structure is valid"

  artifacts:
    name: Upload Artifacts
    runs-on: ubuntu-latest
    needs: [build-core, build-avalonia, build-unity-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Core artifacts
      uses: actions/download-artifact@v4
      with:
        name: director-core
        path: ./artifacts/core
        
    - name: Download Avalonia artifacts
      uses: actions/download-artifact@v4
      with:
        name: director-avalonia
        path: ./artifacts/avalonia
        
    - name: Create release package
      run: |
        mkdir -p ./release
        cp -r ./artifacts/core/* ./release/
        cp -r ./artifacts/avalonia/* ./release/
        cp -r ./Packages/com.nexo.director ./release/
        tar -czf director-studio-release.tar.gz -C ./release .
        
    - name: Upload release
      uses: actions/upload-artifact@v4
      with:
        name: director-studio-release
        path: ./director-studio-release.tar.gz
