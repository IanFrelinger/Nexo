name: Prod dry run (Compose)

# Runs the same production-shaped Compose checks as `scripts/prod-dry-run.sh` on every PR.
# See docs/prod-dry-run.md.

on:
  workflow_dispatch:

concurrency:
  group: prod-dry-run-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prod-dry-run:
    name: ${{ matrix.stack }} stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: portal
            args: "--portal"
          - stack: agent-server
            args: "--agent-server"
    env:
      NEXO_REPO_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker and Compose
        run: |
          docker --version
          docker compose version

      - name: Prod-shaped dry run (${{ matrix.stack }})
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/prod-dry-run.sh || chmod +x scripts/prod-dry-run.sh
          ./scripts/prod-dry-run.sh ${{ matrix.args }}
