name: demo-readiness

on:
  push:
    branches: [ feat/demo-suite, main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_AZURE: ${{ secrets.AZURE_OPENAI_ENDPOINT != '' && secrets.AZURE_OPENAI_KEY != '' }}
      TEST_RESULTS_DIR: TestResults
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore dependencies
        run: dotnet restore tests/Nexo.Demo.Standalone.Tests/Nexo.Demo.Standalone.Tests.csproj
        
      - name: Build project
        run: dotnet build tests/Nexo.Demo.Standalone.Tests/Nexo.Demo.Standalone.Tests.csproj --configuration Release --no-restore
        
      - name: Create test results directory
        run: mkdir -p $TEST_RESULTS_DIR
        
      - name: Detect local model prep
        run: |
          if [ -f "./setup-local-llama.sh" ]; then echo "PREP_LOCAL=true" >> $GITHUB_ENV; else echo "PREP_LOCAL=false" >> $GITHUB_ENV; fi
        
      - name: Prepare local model runtime (optional)
        if: ${{ env.PREP_LOCAL == 'true' }}
        run: |
          set -e
          ./setup-local-llama.sh || true
        
      - name: Run Demo suite (Off mode)
        id: test-off
        env:
          NEXO_AI_MODE: off
        run: |
          dotnet test tests/Nexo.Demo.Standalone.Tests/Nexo.Demo.Standalone.Tests.csproj --filter "Suite=Demo" --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results-off.trx" --results-directory $TEST_RESULTS_DIR
          echo "off_completed=true" >> $GITHUB_OUTPUT
        
      - name: Run Demo suite (Assist mode)
        id: test-assist
        env:
          NEXO_AI_MODE: assist
        run: |
          dotnet test tests/Nexo.Demo.Standalone.Tests/Nexo.Demo.Standalone.Tests.csproj --filter "Suite=Demo" --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results-assist.trx" --results-directory $TEST_RESULTS_DIR
          echo "assist_completed=true" >> $GITHUB_OUTPUT
        
      - name: Run Demo suite (Hybrid Local)
        id: test-hybrid
        env:
          NEXO_AI_MODE: hybrid
          NEXO_PROVIDER: local
          NEXO_MODEL: llama3
        run: |
          dotnet test tests/Nexo.Demo.Standalone.Tests/Nexo.Demo.Standalone.Tests.csproj --filter "Suite=Demo" --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results-hybrid.trx" --results-directory $TEST_RESULTS_DIR
          echo "hybrid_completed=true" >> $GITHUB_OUTPUT
        
      - name: Run Demo suite (Embedded Cloud)
        id: test-embedded
        if: ${{ env.HAS_OPENAI == 'true' }}
        env:
          NEXO_AI_MODE: embedded
          NEXO_PROVIDER: openai
          NEXO_MODEL: gpt-4o
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          dotnet test tests/Nexo.Demo.Standalone.Tests/Nexo.Demo.Standalone.Tests.csproj --filter "Suite=Demo" --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results-embedded.trx" --results-directory $TEST_RESULTS_DIR
          echo "embedded_completed=true" >> $GITHUB_OUTPUT
        
      - name: Run Demo suite (Cloud skipped - no API key)
        if: ${{ env.HAS_OPENAI != 'true' }}
        run: echo "Skipping cloud tests - OPENAI_API_KEY not provided"
        
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-test-results
          path: $TEST_RESULTS_DIR/
          retention-days: 30
        
      - name: Generate test report
        if: always()
        run: |
          echo "## Demo Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | Status | Notes |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.test-off.outcome }}" == "success" ]; then
            echo "| Off | ✅ Passed | Deterministic, no network calls |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Off | ❌ Failed | Check logs for details |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.test-assist.outcome }}" == "success" ]; then
            echo "| Assist | ✅ Passed | Scaffold generation, no runtime AI |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Assist | ❌ Failed | Check logs for details |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.test-hybrid.outcome }}" == "success" ]; then
            echo "| Hybrid Local | ✅ Passed | Local AI processing |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Hybrid Local | ❌ Failed | Check logs for details |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -n "$OPENAI_API_KEY" ]; then
            if [ "${{ steps.test-embedded.outcome }}" == "success" ]; then
              echo "| Embedded Cloud | ✅ Passed | Cloud AI processing |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Embedded Cloud | ❌ Failed | Check logs for details |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Embedded Cloud | ⏭️ Skipped | No API key provided |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Demo tests simulate behavior rather than implementing full functionality. Expected: ~22 passing, ~23 failing tests per mode." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test results are available in the workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Each mode generates a separate TRX file for detailed analysis" >> $GITHUB_STEP_SUMMARY
