name: perf-certification

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline label for this certification run (e.g. release tag or commit SHA)"
        required: false
        default: "manual"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  perf-tests:
    name: perf-certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Run perf / benchmark-scoped tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          echo "{\"baseline\":\"${{ github.event.inputs.baseline }}\",\"runId\":\"${{ github.run_id }}\",\"sha\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > perf-results/perf-certification-meta.json
          dotnet test Ashlar.sln \
            --configuration Release \
            --logger "trx;LogFileName=perf-certification.trx" \
            --results-directory perf-results \
            --filter "FullyQualifiedName~Ashlar.Tests.Orchestration.Performance|FullyQualifiedName~Benchmark" \
            --verbosity minimal
          # Host TRX floor: refuse a silent empty filter. Dispatch-only; do not
          # add pull_request. Images are not involved; python3 is on the runner.
          python3 scripts/assert-trx-min-executed.py \
            --trx perf-results/perf-certification.trx \
            --min-executed 1

      - name: Extract perf metrics and check thresholds
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TRX_FILE="perf-results/perf-certification.trx"
          REPORT_FILE="perf-results/perf-certification-report.json"

          TOTAL=0
          PASSED=0
          FAILED=0
          DURATION_MS=0

          if [[ -f "$TRX_FILE" ]]; then
            read -r TOTAL PASSED FAILED < <(python3 -c '
import xml.etree.ElementTree as ET
from pathlib import Path
root = ET.parse(Path("perf-results/perf-certification.trx")).getroot()
c = root.find(".//{*}ResultSummary/{*}Counters")
if c is None:
    c = root.find(".//{*}Counters")
if c is None:
    raise SystemExit("perf-certification: TRX has no ResultSummary Counters")
print(int(c.attrib.get("total", 0)), int(c.attrib.get("passed", 0)), int(c.attrib.get("failed", 0)))
')
          fi

          PASS_RATE=0
          if [[ "$TOTAL" -gt 0 ]]; then
            PASS_RATE=$(( (PASSED * 100) / TOTAL ))
          fi

          THRESHOLD_PASS_RATE=95
          VERDICT="PASS"
          if [[ "$PASS_RATE" -lt "$THRESHOLD_PASS_RATE" ]]; then
            VERDICT="FAIL"
          fi
          if [[ "$FAILED" -gt 0 ]]; then
            VERDICT="FAIL"
          fi

          cat > "$REPORT_FILE" <<EOF
          {
            "baseline": "${{ github.event.inputs.baseline }}",
            "sha": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "totalTests": $TOTAL,
            "passed": $PASSED,
            "failed": $FAILED,
            "passRate": $PASS_RATE,
            "thresholds": {
              "minPassRate": $THRESHOLD_PASS_RATE,
              "maxFailedTests": 0
            },
            "verdict": "$VERDICT"
          }
          EOF

          echo "## Perf Certification Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total tests | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Passed | $PASSED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failed | $FAILED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pass rate | ${PASS_RATE}% (threshold: ${THRESHOLD_PASS_RATE}%) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Verdict** | **$VERDICT** |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VERDICT" == "FAIL" ]]; then
            echo "::error::Perf certification FAILED: pass rate ${PASS_RATE}% below threshold ${THRESHOLD_PASS_RATE}% or ${FAILED} test(s) failed"
            exit 1
          fi

      - name: Upload perf certification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-certification-${{ github.run_id }}
          path: perf-results/
          retention-days: 90
