name: perf-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/perf-gate.yml"
      - "scripts/perf-gate*.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "src/Ashlar.Tests.Orchestration/**"
      - "src/Ashlar.Tests.BackgroundAgents/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/perf-gate.yml"
      - "scripts/perf-gate*.sh"
      - "scripts/run-dotnet-test-counted.py"
      - "src/Ashlar.Tests.Orchestration/**"
      - "src/Ashlar.Tests.BackgroundAgents/**"

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Tier A (counted performance slices)
        run: bash scripts/perf-gate-tier-a.sh
      - name: Tiers B–D + baseline
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          bash scripts/perf-gate-tier-b.sh
          bash scripts/perf-gate-tier-c.sh
          bash scripts/perf-gate-tier-d.sh
          bash scripts/perf-gate-baseline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-gate-${{ github.run_id }}
          path: .ashlar/perf/
          if-no-files-found: warn
