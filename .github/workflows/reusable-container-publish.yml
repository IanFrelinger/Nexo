# Reusable: build and push nexo-cli + nexo-api to GHCR.
# Called from release.yml (tags / manual) or container-image-publish.yml (manual dispatch).

on:
  workflow_call:
    inputs:
      skip_multi_arch:
        description: "When true, publish latest nexo-cli as amd64 only (main branch builds)"
        type: boolean
        required: false
        default: false
    outputs:
      cli_sha_tag:
        description: "Immutable GHCR tag for nexo-cli (sha-...)"
        value: ${{ jobs.publish-cli.outputs.cli_sha_tag }}
      api_sha_tag:
        description: "Immutable GHCR tag for nexo-api (sha-...)"
        value: ${{ jobs.publish-api.outputs.api_sha_tag }}

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish-reusable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-cli:
    name: GHCR nexo-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      cli_sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/nexo-cli"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "SHA_TAG=${SHA_TAG}" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            echo "SEMVER_TAG=${IMAGE}:${SEMVER}" >> "${GITHUB_ENV}"
          else
            echo "SEMVER_TAG=" >> "${GITHUB_ENV}"
          fi

      - name: Build and push linux/amd64 (immutable sha tag)
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --platform linux/amd64 \
            --tag "${SHA_TAG}" \
            --push \
            .

      - name: Smoke test published image
        shell: bash
        run: |
          docker run --rm "${SHA_TAG}" --help

      - name: Publish latest (amd64 + arm64) on main
        if: >-
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
          && inputs.skip_multi_arch == false
        timeout-minutes: 35
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Publish latest (amd64 only) when multi-arch skipped
        if: >-
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
          && inputs.skip_multi_arch == true
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --platform linux/amd64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Tag semver on release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --platform linux/amd64 \
            --tag "${SEMVER_TAG}" \
            --push \
            .

  publish-api:
    name: GHCR nexo-api
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      api_sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/nexo-api"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "SHA_TAG=${SHA_TAG}" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            echo "SEMVER_TAG=${IMAGE}:${SEMVER}" >> "${GITHUB_ENV}"
          else
            echo "SEMVER_TAG=" >> "${GITHUB_ENV}"
          fi

      - name: Build and push linux/amd64 (immutable sha tag)
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.api \
            --platform linux/amd64 \
            --tag "${SHA_TAG}" \
            --push \
            .

      - name: Smoke test published API image (/health)
        shell: bash
        run: |
          cid="$(docker run -d -p 127.0.0.1:18081:8080 "${SHA_TAG}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18081/health" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish latest on main
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.api \
            --platform linux/amd64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Tag semver on release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.api \
            --platform linux/amd64 \
            --tag "${SEMVER_TAG}" \
            --push \
            .
