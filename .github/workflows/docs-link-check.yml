# Validates external links in README + docs (relative links resolved from repo root).
name: Docs Link Check

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-link-check.yml"
      - ".lycheeignore"
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-link-check.yml"
      - ".lycheeignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: lychee (README + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2.4.0
        with:
          args: --no-progress --max-concurrency 8 --user-agent "nexo-docs-link-check" README.md "docs/**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
