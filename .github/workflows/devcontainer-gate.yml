name: Dev Container Gate

on:
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/devcontainer-gate.yml"
      - "scripts/Verify-DevContainer.ps1"
      - ".devcontainer/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "src/Nexo.CLI/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Tests.Infrastructure/**"
      - "Nexo.LocalDevCore.slnf"
  pull_request:
    paths:
      - ".github/workflows/devcontainer-gate.yml"
      - "scripts/Verify-DevContainer.ps1"
      - ".devcontainer/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "src/Nexo.CLI/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Tests.Infrastructure/**"
      - "Nexo.LocalDevCore.slnf"
  workflow_dispatch:

jobs:
  devcontainer-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post-create + CLI build inside dev image
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Verify-DevContainer.ps1 -RepoRoot "${{ github.workspace }}"
