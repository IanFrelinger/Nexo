name: Dev Container Gate

on:
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/devcontainer-gate.yml"
      - "scripts/Verify-DevContainer.ps1"
      - ".devcontainer/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "application/src/Ashlar.CLI/**"
      - "src/Ashlar.Core.Application/**"
      - "src/Ashlar.Infrastructure/**"
      - "src/Ashlar.Tests.Infrastructure/**"
      - "Ashlar.LocalDevCore.slnf"
  workflow_dispatch:

jobs:
  devcontainer-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Post-create + CLI build inside dev image
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Verify-DevContainer.ps1 -RepoRoot "${{ github.workspace }}"
