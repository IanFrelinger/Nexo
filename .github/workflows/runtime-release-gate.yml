name: Runtime Release Gate

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/runtime-release-gate.yml'
      - 'application/src/Nexo.CLI/Commands/RuntimeCommand.cs'
      - 'application/src/Nexo.CLI/Commands/SelfExtendCommand.cs'
      - 'application/src/Nexo.CLI/Commands/BootstrapCommand.cs'
      - 'application/src/Nexo.CLI/Commands/CiCommand.cs'
      - 'application/src/Nexo.CLI/Nexo.CLI.csproj'
      - 'application/src/Nexo.CLI/Runtime/**'
      - 'application/src/Nexo.Tests.CLI/**'
      - 'docs/runtime/benchmarks/**'

jobs:
  runtime-release-lanes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [core, visual]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore application/src/Nexo.CLI/Nexo.CLI.csproj

      - name: Restore copy-assemblies helper
        run: dotnet restore src/Nexo.Tests.Infrastructure/scripts/copy-assemblies.csproj

      - name: Build
        run: dotnet build application/src/Nexo.CLI/Nexo.CLI.csproj --no-restore -v minimal

      - name: Runtime release lane gate
        run: dotnet run --project application/src/Nexo.CLI -- runtime release-gate --repo-root . --mode ${{ matrix.lane }} --allow-mock --core-min-total 3 --core-history-window 3 --visual-required-mode true --visual-min-total 3 --visual-history-window 3 --lane-repetitions 1 --emit-slo-evidence --slo-warning-only --ncr-resolution-ms-slo 250 --ncr-load-ms-slo 1000 --ncr-outcome-ms-slo 1500 --ncr-failure-rate-slo 0.2
      - name: Upload runtime SLO evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-slo-evidence-${{ matrix.lane }}
          path: |
            .nexo/runtime/release-gate/last-run/evidence.json
            .nexo/runtime/release-gate/last-run/evidence.md
          if-no-files-found: warn

  runtime-release-chaos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore application/src/Nexo.CLI/Nexo.CLI.csproj

      - name: Restore copy-assemblies helper
        run: dotnet restore src/Nexo.Tests.Infrastructure/scripts/copy-assemblies.csproj

      - name: Build
        run: dotnet build application/src/Nexo.CLI/Nexo.CLI.csproj --no-restore -v minimal

      - name: Runtime chaos lane (non-gating)
        continue-on-error: true
        run: dotnet run --project application/src/Nexo.CLI -- runtime release-gate --repo-root . --mode chaos
      - name: Upload runtime SLO evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-slo-evidence-chaos
          path: |
            .nexo/runtime/release-gate/last-run/evidence.json
            .nexo/runtime/release-gate/last-run/evidence.md
          if-no-files-found: warn
