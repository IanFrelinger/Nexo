# Verify NuGet package consumption (published feed + local pack)
name: NuGet consumer verify

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver of Nexo.Hosting.Bundle on nuget.org (e.g. 1.0.0)"
        required: true
        type: string
  schedule:
    # Weekly: optional smoke when NEXO_VERIFY_NUGET_VERSION is set (repo variable)
    - cron: "0 6 * * 1"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/nuget-consumer-verify.yml"
      - "scripts/verify-stable-sdk-host-sample-published-feed.sh"
      - "scripts/verify-stable-sdk-host-sample-packages.sh"
      - "docs/samples/StableSdkHostSample/**"
      - "scripts/pack-nexo-hosting-graph.sh"
  pull_request:
    paths:
      - ".github/workflows/nuget-consumer-verify.yml"
      - "scripts/verify-stable-sdk-host-sample-published-feed.sh"
      - "scripts/verify-stable-sdk-host-sample-packages.sh"
      - "docs/samples/StableSdkHostSample/**"
      - "scripts/pack-nexo-hosting-graph.sh"

jobs:
  verify-local-pack:
    name: verify-local-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack + restore sample (same as pre-push)
        env:
          NEXO_SDK_PACKAGE_VERSION: "9.9.9-ci-${{ github.run_id }}"
        run: bash scripts/verify-stable-sdk-host-sample-packages.sh

  verify-published:
    name: verify-published-nuget-org
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify against nuget.org
        run: bash scripts/verify-stable-sdk-host-sample-published-feed.sh "${{ inputs.version }}"

  verify-published-scheduled:
    name: verify-published-scheduled
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify published version (repo variable)
        env:
          NEXO_VERIFY_VERSION: ${{ vars.NEXO_VERIFY_NUGET_VERSION }}
        run: |
          if [ -z "${NEXO_VERIFY_VERSION}" ] || [ "${NEXO_VERIFY_VERSION}" = "" ]; then
            echo "NEXO_VERIFY_NUGET_VERSION not set; skipping scheduled publish verify."
            exit 0
          fi
          bash scripts/verify-stable-sdk-host-sample-published-feed.sh "${NEXO_VERIFY_VERSION}"
