# Verify NuGet package consumption (published feed + local pack)
name: NuGet consumer verify

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver of Nexo.Hosting.Bundle on nuget.org (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  verify-local-pack:
    name: verify-local-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Pack + restore sample (same as pre-push)
        env:
          NEXO_SDK_PACKAGE_VERSION: "9.9.9-ci-${{ github.run_id }}"
        run: bash scripts/verify-stable-sdk-host-sample-packages.sh

  verify-published:
    name: verify-published-nuget-org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Verify against nuget.org
        run: bash scripts/verify-stable-sdk-host-sample-published-feed.sh "${{ inputs.version }}"
