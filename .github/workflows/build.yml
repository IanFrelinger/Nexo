name: Build Director Studio

on:
  push:
    branches: [ master, develop, feature/* ]
    paths:
      - 'src/NexoDirectorStudio/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/NexoDirectorStudio/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build Director Studio
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Build Director Studio Runtime
      run: |
        cd src/NexoDirectorStudio/Assets/NexoDirectorStudio
        dotnet build Runtime/NexoDirectorStudio.Runtime.asmdef --configuration Release --no-restore
    
    - name: Build Director Studio Editor
      run: |
        cd src/NexoDirectorStudio/Assets/NexoDirectorStudio
        dotnet build Editor/NexoDirectorStudio.Editor.asmdef --configuration Release --no-restore
    
    - name: Build Director Studio Tests
      run: |
        cd src/NexoDirectorStudio/Assets/NexoDirectorStudio
        dotnet build Tests/EditMode/NexoDirectorStudio.Tests.EditMode.asmdef --configuration Release --no-restore
        dotnet build Tests/PlayMode/NexoDirectorStudio.Tests.PlayMode.asmdef --configuration Release --no-restore
    
    - name: Verify Assembly References
      run: |
        echo "Verifying assembly references..."
        # Check that Editor assembly doesn't reference Runtime directly
        # Check that Runtime assembly has correct Nexo references
        # Check that test assemblies have correct references
    
    - name: Check for Compilation Errors
      run: |
        echo "Checking for compilation errors..."
        # Verify no compilation errors in any assembly
        # Check for missing references
        # Verify assembly definition files are valid
    
    - name: Validate Unity Package Structure
      run: |
        echo "Validating Unity package structure..."
        # Check that package.json exists and is valid
        # Verify assembly definition files are properly configured
        # Check that all required files are present
    
    - name: Upload Build Artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: director-studio-build-${{ matrix.os }}
        path: |
          src/NexoDirectorStudio/Assets/NexoDirectorStudio/
        retention-days: 7
    
    - name: Build Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        echo "- **.NET Version**: ${{ matrix.dotnet-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
        echo "- **Artifacts**: Available for download" >> $GITHUB_STEP_SUMMARY