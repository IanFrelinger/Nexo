name: Spike S1 Escape Rate (manual)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  escape-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dotnet-stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run escape-rate harness (offline, seeds=8, mutation-sample=3)
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet run --project src/Nexo.Spike.S1 -- --seeds 8 --mutation-sample 3 --budget-minutes 45 --out artifacts/s1

      - name: Ratchet escape rate within catalog version
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/s1/escape-rate-report.json")
          baseline_path = Path("artifacts/s1/escape-rate-baseline.json")

          report = json.loads(report_path.read_text())
          baseline = json.loads(baseline_path.read_text())
          catalog = report["catalogVersion"]
          versions = baseline.get("catalogVersions", {})

          if catalog not in versions:
              raise SystemExit(
                  f"No baseline entry for catalogVersion {catalog!r}. "
                  "Commit a baseline from the first run for this catalog version."
              )

          entry = versions[catalog]
          wrong_rate = report["wrongImpl"]["escapeRate"]
          weak_rate = report["weakTest"]["escapeRate"]
          base_wrong = entry.get("wrongImplEscapeRate")
          base_weak = entry.get("weakTestEscapeRate")

          print(f"catalogVersion={catalog}")
          print(f"wrong-impl escape rate: {wrong_rate:.6f} (baseline {base_wrong})")
          print(f"weak-test escape rate: {weak_rate:.6f} (baseline {base_weak})")

          if base_wrong is not None and wrong_rate > float(base_wrong) + 1e-9:
              raise SystemExit(
                  f"Wrong-impl escape rate regressed for {catalog}: {wrong_rate:.6f} > {base_wrong}"
              )
          if base_weak is not None and weak_rate > float(base_weak) + 1e-9:
              raise SystemExit(
                  f"Weak-test escape rate regressed for {catalog}: {weak_rate:.6f} > {base_weak}"
              )
          PY

      - name: Upload escape-rate report
        uses: actions/upload-artifact@v4
        with:
          name: s1-escape-rate-report
          path: artifacts/s1/
