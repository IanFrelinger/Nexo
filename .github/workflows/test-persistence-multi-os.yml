# Run persistence tests on multiple OS runners (Ubuntu, macOS, Windows).
# Includes a Docker option for Windows: job runs on windows-latest and runs
# tests inside the Windows container image.
name: Persistence Tests (Multi-OS)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/Nexo.Core.Application/Persistence/**'
      - 'src/Nexo.Infrastructure/Persistence/**'
      - 'src/Nexo.Tests.Infrastructure/Tests/Persistence/**'
      - 'application/src/Nexo.CLI/Commands/TestMultiEnvCommand.cs'
      - '.docker/Dockerfile.test-caching-windows'
  workflow_dispatch:

jobs:
  persistence-tests-native:
    name: Persistence - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Nexo.sln

      - name: Build
        run: dotnet build Nexo.sln --no-restore -v minimal

      - name: Run persistence tests
        shell: bash
        run: |
          dotnet test src/Nexo.Tests.Infrastructure/Nexo.Tests.Infrastructure.csproj \
            --no-build \
            --filter "FullyQualifiedName~InMemoryPersistenceTests" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=persistence-${{ matrix.os }}.trx" \
            --results-directory test-results/persistence

      - name: Publish test results
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/persistence/**/*.trx
          check_name: Persistence Tests - ${{ matrix.os }}
          report_individual_runs: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-${{ matrix.os }}
          path: test-results/persistence/
          retention-days: 14

  # Docker option for Windows: run persistence tests inside the Windows container.
  # Disabled on hosted runners: GitHub windows-latest is now Windows Server 2025
  # (build 26100), and the public mcr.microsoft.com/dotnet/sdk Windows manifest
  # list has no matching variant for that build, causing buildx setup to fail.
  # Re-enable behind a self-hosted Windows Server 2022 runner if needed.
  persistence-tests-windows-docker:
    name: Persistence - Windows (Docker)
    if: ${{ vars.NEXO_WINDOWS_DOCKER_PERSISTENCE == '1' }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Windows Docker image
        run: |
          docker build -f .docker/Dockerfile.test-caching-windows `
            --build-arg DOTNET_VERSION=8.0 `
            -t nexo-persistence-test:windows-8.0 `
            .

      - name: Run persistence tests in Windows container
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results/persistence
          docker run --rm `
            -v "${env:GITHUB_WORKSPACE}/test-results/persistence:C:\workspace\test-results" `
            nexo-persistence-test:windows-8.0 `
            cmd /c "cd /d C:\workspace && dotnet test src\Nexo.Tests.Infrastructure\Nexo.Tests.Infrastructure.csproj --filter \"FullyQualifiedName~InMemoryPersistenceTests\" --logger \"console;verbosity=minimal\" --logger \"trx;LogFileName=windows-8.0-persistence.trx\" --results-directory C:\workspace\test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-windows-docker
          path: test-results/persistence/
          retention-days: 14
