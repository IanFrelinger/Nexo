# TEMPORARY diagnostic workflow — delete once the Infrastructure suite hang is fixed.
#
# Round 1 ran the whole suite under --blame-hang and named two incomplete tests
# (maxParallelThreads is 2, so both in-flight slots were stalled):
#
#   Tests.API.ApiDevelopmentHostDiTests.Development_host_di_graph_builds_without_scoped_singleton_violations
#   Tests.Execution.InfrastructureRoutingGapCoverageTests.AddNexoFederatedBrickMesh_throws_without_local_registry
#
# The second is pure in-memory DI with no I/O and has no plausible way to block, so
# it is almost certainly collateral — it just held the other parallel slot. This
# round isolates the first one to establish that it really is the blocker, and
# crucially WHAT it blocks on: naming the test is not the same as knowing the cause,
# and the fix differs entirely between an unreachable Docker daemon, a port bind, and
# a genuine startup deadlock.
#
# A hang dump alone does not answer that, so the dump is analysed in-job with
# dotnet-dump to print managed stacks for every thread. The blocked frame is the
# evidence.
name: Infra hang diagnosis (temporary)

on:
  push:
    branches:
      - cursor/infra-suite-hang
  workflow_dispatch:

jobs:
  isolate-api-host-test:
    name: isolate ApiDevelopmentHostDiTests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Environment facts
        # Recorded up front so the stacks can be read against what was actually
        # available. If Docker is reachable here, "the daemon is missing" is ruled out
        # and the cause lies elsewhere.
        run: |
          echo "=== docker ==="
          docker info >/dev/null 2>&1 && echo "docker: AVAILABLE" || echo "docker: UNAVAILABLE"
          docker version 2>&1 | head -5 || true
          echo "=== DOCKER_HOST ==="
          echo "${DOCKER_HOST:-<unset>}"
          echo "=== docker socket ==="
          ls -l /var/run/docker.sock 2>&1 || echo "no /var/run/docker.sock"

      - name: Build
        run: dotnet build src/Nexo.Tests.Infrastructure/Nexo.Tests.Infrastructure.csproj -f net9.0 --verbosity minimal

      - name: Run ONLY ApiDevelopmentHostDiTests under blame-hang
        # 3 minutes of inactivity is plenty for a single DI-graph validation; if it
        # has not finished by then it is blocked, not slow.
        run: |
          dotnet test src/Nexo.Tests.Infrastructure/Nexo.Tests.Infrastructure.csproj \
            -f net9.0 --no-build \
            --filter "FullyQualifiedName~ApiDevelopmentHostDiTests" \
            --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type full \
            --logger "console;verbosity=normal" \
            --results-directory "$GITHUB_WORKSPACE/HangResults"

      - name: Analyse the hang dump
        if: always()
        # This is the step that actually answers "what is it waiting on".
        run: |
          set +e
          dump=$(find "$GITHUB_WORKSPACE/HangResults" -name '*.dmp' | head -1)
          echo "dump: ${dump:-<none found>}"
          if [ -z "$dump" ]; then
            echo "No dump produced — the test did not hang in this configuration."
            exit 0
          fi
          dotnet tool install --global dotnet-dump >/dev/null 2>&1
          export PATH="$PATH:$HOME/.dotnet/tools"

          # dumpasync is the one that matters. A hosted service whose StartAsync is
          # awaiting a network call owns NO thread, so it is invisible to clrstack —
          # which is exactly why the previous round could name the blocking PATTERN
          # (sync-over-async on host.StartAsync) but not the service responsible.
          echo "=== pending async state machines ==="
          dotnet-dump analyze "$dump" -c "dumpasync -completed" -c "exit" 2>&1 | head -250
          echo ""
          echo "=== async frames mentioning Nexo ==="
          dotnet-dump analyze "$dump" -c "dumpasync" -c "exit" 2>&1 | grep -iE 'Nexo|Ollama|HostedService|StartAsync|Ncr' | head -60
          echo ""
          echo "=== managed stacks, all threads ==="
          dotnet-dump analyze "$dump" -c "clrstack -all" -c "exit" 2>&1 | head -200

      - name: Upload dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-host-hang-dump
          path: HangResults/
          if-no-files-found: warn
          retention-days: 7
