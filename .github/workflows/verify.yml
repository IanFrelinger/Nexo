name: verify

on:
  push:
    branches: [ master, feat/verification-harness ]
  pull_request:
    branches: [ master ]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        mode: [off, hybrid, embedded]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_AZURE: ${{ secrets.AZURE_OPENAI_ENDPOINT != '' && secrets.AZURE_OPENAI_KEY != '' }}
      TEST_RESULTS_DIR: TestResults

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Build Nexo CLI
        run: dotnet build src/Nexo.CLI/Nexo.CLI.csproj -c Release

      - name: Pack Nexo CLI
        run: dotnet pack src/Nexo.CLI/Nexo.CLI.csproj -c Release -o ./nupkgs

      - name: Install Nexo CLI locally
        run: |
          dotnet tool install --tool-path ./tools Nexo.CLI --add-source ./nupkgs
          echo "$PWD/tools" >> $GITHUB_PATH

      - name: Create test results directory
        run: mkdir -p $TEST_RESULTS_DIR

      - name: Run unit tests
        run: dotnet test -c Release --no-build --verbosity normal --logger "trx" --results-directory $TEST_RESULTS_DIR

      - name: Detect local model prep
        run: |
          if [ -f "./setup-local-llama.sh" ]; then echo "PREP_LOCAL=true" >> $GITHUB_ENV; else echo "PREP_LOCAL=false" >> $GITHUB_ENV; fi

      - name: Prepare local model runtime (optional)
        if: ${{ matrix.mode == 'hybrid' && env.PREP_LOCAL == 'true' }}
        run: |
          set -e
          ./setup-local-llama.sh || true

      # OFF: enforce no network calls, offline only
      - name: OFF (no network, docker preferred with fallback)
        if: ${{ matrix.mode == 'off' && matrix.os == 'ubuntu-latest' }}
        env:
          NEXO_AI_MODE: off
        shell: bash
        run: |
          if [ -f Dockerfile.test ]; then
            docker build -f Dockerfile.test -t nexo-tests .
            docker run --rm --network none nexo-tests nexo verify tests/specs --mode off
          else
            echo "Dockerfile.test missing; running in-process offline verify. TODO: add Docker test harness."
            nexo verify tests/specs --mode off
          fi

      - name: OFF (no network, in-process guard)
        if: ${{ matrix.mode == 'off' && matrix.os != 'ubuntu-latest' }}
        env:
          NEXO_AI_MODE: off
        run: |
          nexo verify tests/specs --mode off

      - name: HYBRID (local model)
        if: ${{ matrix.mode == 'hybrid' }}
        env:
          NEXO_AI_MODE: hybrid
          NEXO_PROVIDER: local
          NEXO_MODEL: llama3
        run: nexo verify tests/specs

      - name: EMBEDDED (cloud) — gated on secret
        if: ${{ matrix.mode == 'embedded' && (env.HAS_OPENAI == 'true' || env.HAS_AZURE == 'true') }}
        env:
          NEXO_AI_MODE: embedded
          NEXO_PROVIDER: ${{ env.HAS_OPENAI == 'true' && 'openai' || 'azure' }}
          NEXO_MODEL: ${{ env.HAS_OPENAI == 'true' && 'gpt-4o' || 'gpt-4o' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
        run: nexo verify tests/specs

      # Unity headless scaffolding (commented out, for later enablement)
      # - name: Set up Unity
      #   uses: game-ci/unity-setup@v4
      #   with:
      #     unityVersion: 2022.3.39f1
      # - name: PlayMode tests (headless)
      #   if: ${{ env.RUN_UNITY == 'true' }}
      #   run: |
      #     Unity -batchmode -nographics -projectPath unity-test-project \
      #       -runTests -testPlatform PlayMode -testResults $TEST_RESULTS_DIR/unity-playmode.xml -logFile -

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.mode }}
          path: $TEST_RESULTS_DIR/
