name: Code Analysis

on:
  push:
    branches: [ master, develop, feature/* ]
    paths:
      - 'src/NexoDirectorStudio/**'
      - '.github/workflows/analyzers.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/NexoDirectorStudio/**'
      - '.github/workflows/analyzers.yml'

jobs:
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Run Code Analysis
      run: |
        cd src/NexoDirectorStudio/Assets/NexoDirectorStudio
        dotnet build --configuration Release --no-restore --verbosity normal | tee build-output.txt
    
    - name: Check for Warnings
      run: |
        echo "Checking for compilation warnings..."
        if grep -i "warning" build-output.txt; then
          echo "⚠️ Warnings found in build output"
          echo "## Warnings Found" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          grep -i "warning" build-output.txt >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No warnings found"
        fi
    
    - name: Check for Errors
      run: |
        echo "Checking for compilation errors..."
        if grep -i "error" build-output.txt; then
          echo "❌ Errors found in build output"
          echo "## Errors Found" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          grep -i "error" build-output.txt >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ No errors found"
        fi
    
    - name: Run Static Analysis
      run: |
        echo "Running static analysis..."
        # Check for common code smells
        echo "Checking for TODO comments..."
        if grep -r "TODO" src/NexoDirectorStudio/Assets/NexoDirectorStudio/ --include="*.cs"; then
          echo "⚠️ TODO comments found"
        else
          echo "✅ No TODO comments found"
        fi
        
        echo "Checking for FIXME comments..."
        if grep -r "FIXME" src/NexoDirectorStudio/Assets/NexoDirectorStudio/ --include="*.cs"; then
          echo "⚠️ FIXME comments found"
        else
          echo "✅ No FIXME comments found"
        fi
        
        echo "Checking for HACK comments..."
        if grep -r "HACK" src/NexoDirectorStudio/Assets/NexoDirectorStudio/ --include="*.cs"; then
          echo "⚠️ HACK comments found"
        else
          echo "✅ No HACK comments found"
        fi
    
    - name: Check Code Complexity
      run: |
        echo "Checking code complexity..."
        # Count lines of code
        echo "Lines of code:"
        find src/NexoDirectorStudio/Assets/NexoDirectorStudio/ -name "*.cs" -exec wc -l {} + | tail -1
        
        # Count files
        echo "Number of C# files:"
        find src/NexoDirectorStudio/Assets/NexoDirectorStudio/ -name "*.cs" | wc -l
        
        # Check for large files
        echo "Large files (>500 lines):"
        find src/NexoDirectorStudio/Assets/NexoDirectorStudio/ -name "*.cs" -exec wc -l {} + | awk '$1 > 500 {print $2 " (" $1 " lines)"}'
    
    - name: Check Assembly Dependencies
      run: |
        echo "Checking assembly dependencies..."
        echo "## Assembly Dependencies" >> $GITHUB_STEP_SUMMARY
        echo "```" >> $GITHUB_STEP_SUMMARY
        echo "Runtime Assembly:" >> $GITHUB_STEP_SUMMARY
        cat src/NexoDirectorStudio/Assets/NexoDirectorStudio/Runtime/NexoDirectorStudio.Runtime.asmdef >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Editor Assembly:" >> $GITHUB_STEP_SUMMARY
        cat src/NexoDirectorStudio/Assets/NexoDirectorStudio/Editor/NexoDirectorStudio.Editor.asmdef >> $GITHUB_STEP_SUMMARY
        echo "```" >> $GITHUB_STEP_SUMMARY
    
    - name: Check Package Structure
      run: |
        echo "Checking package structure..."
        echo "## Package Structure" >> $GITHUB_STEP_SUMMARY
        echo "```" >> $GITHUB_STEP_SUMMARY
        tree src/NexoDirectorStudio/Assets/NexoDirectorStudio/ -I "bin|obj" >> $GITHUB_STEP_SUMMARY
        echo "```" >> $GITHUB_STEP_SUMMARY
    
    - name: Upload Analysis Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: analysis-results
        path: |
          build-output.txt
        retention-days: 7
    
    - name: Analysis Summary
      run: |
        echo "## Code Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status**: ✅ Successful" >> $GITHUB_STEP_SUMMARY
        echo "- **Warnings**: Checked" >> $GITHUB_STEP_SUMMARY
        echo "- **Errors**: None found" >> $GITHUB_STEP_SUMMARY
        echo "- **Static Analysis**: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- **Package Structure**: Validated" >> $GITHUB_STEP_SUMMARY