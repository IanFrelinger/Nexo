# Line coverage floors for kernel assemblies (domain 100%, infrastructure + application ratchet).
name: Kernel coverage gate

on:
  push:
    branches: [master, main, "cursor/**"]
    paths:
      - ".github/workflows/kernel-coverage-gate.yml"
      - "scripts/ci/kernel-coverage-gate.sh"
      - "src/Nexo.Core.Domain/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Tests.Domain/**"
      - "src/Nexo.Tests.Application/**"
      - "src/Nexo.Tests.Infrastructure/**"
      - "docs/architecture/TestingStrategy*.md"
      - ".github/workflows/testing-strategy-gate.yml"
      - "scripts/ci/pr-testing-strategy-gate.sh"
      - "Directory.Packages.props"
      - "Directory.Build.props"
  pull_request:
    paths:
      - ".github/workflows/kernel-coverage-gate.yml"
      - ".github/workflows/testing-strategy-gate.yml"
      - "scripts/ci/kernel-coverage-gate.sh"
      - "scripts/ci/pr-testing-strategy-gate.sh"
      - "src/Nexo.Core.Domain/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Tests.Domain/**"
      - "src/Nexo.Tests.Application/**"
      - "src/Nexo.Tests.Infrastructure/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"

jobs:
  kernel-coverage:
    name: kernel-coverage
    runs-on: ubuntu-latest
    # TEMPORARILY 60 — measurement run, to be lowered again once the real duration
    # is known.
    #
    # The crash that stopped this job ever completing is fixed (see
    # BrickMutationEngine: the certification mutation engine was tearing down
    # overlapping collectible AssemblyLoadContexts). With it fixed, the Infrastructure
    # suite runs to completion for the first time — and therefore takes far longer
    # than when it died partway through, so the previous 30-minute cap cut it off
    # before it could report a number.
    #
    # 60 buys one run that reaches a verdict, which is what establishes both the real
    # coverage figure and the real duration. The permanent cap is set from that
    # duration plus margin; it is not meant to stay here.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run kernel coverage gate
        run: bash scripts/ci/kernel-coverage-gate.sh
