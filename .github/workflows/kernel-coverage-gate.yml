# Line coverage floors for kernel assemblies (domain 100%, infrastructure + application ratchet).
name: Kernel coverage gate

on:
  push:
    branches: [master, main, "cursor/**"]
    paths:
      - ".github/workflows/kernel-coverage-gate.yml"
      - "scripts/ci/kernel-coverage-gate.sh"
      - "src/Nexo.Core.Domain/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Tests.Domain/**"
      - "src/Nexo.Tests.Application/**"
      - "src/Nexo.Tests.Infrastructure/**"
      - "docs/architecture/TestingStrategy*.md"
      - ".github/workflows/testing-strategy-gate.yml"
      - "scripts/ci/pr-testing-strategy-gate.sh"
      - "Directory.Packages.props"
      - "Directory.Build.props"
  pull_request:
    paths:
      - ".github/workflows/kernel-coverage-gate.yml"
      - ".github/workflows/testing-strategy-gate.yml"
      - "scripts/ci/kernel-coverage-gate.sh"
      - "scripts/ci/pr-testing-strategy-gate.sh"
      - "src/Nexo.Core.Domain/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Tests.Domain/**"
      - "src/Nexo.Tests.Application/**"
      - "src/Nexo.Tests.Infrastructure/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"

jobs:
  kernel-coverage:
    name: kernel-coverage
    runs-on: ubuntu-latest
    # This job has never completed: the Infrastructure coverage step's test host
    # crashes at teardown, VSTest never returns, and with no explicit limit the job
    # burned GitHub's 6-hour default before being auto-cancelled — on master and on
    # dependabot branches alike. The underlying crash is NOT fixed here (see
    # docs/production-readiness/KernelCoverageGate-Findings.md); this simply stops it
    # wasting six hours of runner time per push to report the same non-answer.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run kernel coverage gate
        run: bash scripts/ci/kernel-coverage-gate.sh
