# Line coverage floors for kernel assemblies (domain 100%, infrastructure + application ratchet).
name: Kernel coverage gate

on:
  push:
    branches: [master, main, "cursor/**"]
    paths:
      - ".github/workflows/kernel-coverage-gate.yml"
      - "scripts/ci/kernel-coverage-gate.sh"
      - "src/Nexo.Core.Domain/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Tests.Domain/**"
      - "src/Nexo.Tests.Application/**"
      - "src/Nexo.Tests.Infrastructure/**"
      - "docs/architecture/TestingStrategy*.md"
      - ".github/workflows/testing-strategy-gate.yml"
      - "scripts/ci/pr-testing-strategy-gate.sh"
      - "Directory.Packages.props"
      - "Directory.Build.props"
  pull_request:
    paths:
      - ".github/workflows/kernel-coverage-gate.yml"
      - ".github/workflows/testing-strategy-gate.yml"
      - "scripts/ci/kernel-coverage-gate.sh"
      - "scripts/ci/pr-testing-strategy-gate.sh"
      - "src/Nexo.Core.Domain/**"
      - "src/Nexo.Core.Application/**"
      - "src/Nexo.Infrastructure/**"
      - "src/Nexo.Tests.Domain/**"
      - "src/Nexo.Tests.Application/**"
      - "src/Nexo.Tests.Infrastructure/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"

jobs:
  kernel-coverage:
    name: kernel-coverage
    runs-on: ubuntu-latest
    # Backstop, kept deliberately. The job used to burn GitHub's 6-hour default
    # because the Infrastructure coverage step could never return.
    #
    # TEMPORARILY 45 for one measurement round. Four stacked defects kept that step
    # from ever returning; all are fixed and Infrastructure is back in the gate (see
    # docs/production-readiness/KernelCoverageGate-Findings.md). A suite that finishes
    # is necessarily slower than one that died partway through, so the permanent cap is
    # set from an OBSERVED clean duration rather than a guess.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run kernel coverage gate
        run: bash scripts/ci/kernel-coverage-gate.sh
