name: Provenance Graph CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Nexo.Provenance.Graph/**'
      - 'src/Nexo.Provenance.Graph.Tests/**'
      - 'docker-compose.provenance.yml'
      - '.github/workflows/provenance-graph-gate.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run provenance graph unit tests
        run: dotnet test src/Nexo.Provenance.Graph.Tests/Nexo.Provenance.Graph.Tests.csproj --filter "Category!=Integration" --configuration Release

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run provenance graph Neo4j integration tests
        env:
          NEXO_RUN_NEO4J_CONTAINER: "1"
        run: dotnet test src/Nexo.Provenance.Graph.Tests/Nexo.Provenance.Graph.Tests.csproj --filter "Category=Integration" --configuration Release
