# Security & trust gate.
# See docs/production-readiness/SecurityHardeningPlan-v1.md
#
# PR coverage is Tiers A–D plus the Tier E host suite (counted AirGapped|Safety
# on net10, no container). The Tier E `--network none` container stays
# dispatch-only. A green PR security-gate is still not equivalent to the
# autonomous release-manager `security` lane, which runs `make security-gate-full`
# with SECURITY_GATE_AIRGAPPED_CONTAINER=1.
name: Security Gate

on:
  pull_request:
    paths:
      - "src/Ashlar.Infrastructure/Trust/**"
      - "src/Ashlar.Core.Application/Trust/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/Trust/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/API/*Security*.cs"
      - "src/Ashlar.Tests.Infrastructure/Tests/API/AshlarApi*.cs"
      - "src/Ashlar.Tests.Infrastructure/Tests/Safety/**"
      - "src/Ashlar.Manifest/**"
      - "src/Ashlar.Certification.Contracts/**"
      - "src/Ashlar.Certification.State/**"
      - "src/Ashlar.Infrastructure/Certification/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/Certification/**"
      - "application/src/Ashlar.API/Security/**"
      - "application/src/Ashlar.CLI/Commands/PkgCommand.cs"
      - "application/src/Ashlar.CLI/Commands/PackageImport.cs"
      # The rest of the surface Tier C actually asserts on. Selecting the workflow is half of
      # running a lane: a correct `if:` on the step still never fires if no path change starts the
      # workflow, and the bounded .ashpkg read, the console escaping, and the mesh serve endpoints
      # all live outside the two files above.
      - "application/src/Ashlar.CLI/Packaging/**"
      - "application/src/Ashlar.CLI/Output/**"
      - "application/src/Ashlar.CLI/Commands/BackgroundAgent/**"
      - "application/src/Ashlar.Tests.CLI/**"
      - "application/src/Ashlar.CLI/Commands/TrustCommand.cs"
      - "application/src/Ashlar.CLI/Program.TrustCommands.cs"
      - "application/src/Ashlar.CLI/Program.CommandRegistration.cs"
      - "scripts/security-gate*.sh"
      - "Makefile"
      - ".github/workflows/security-gate.yml"
  workflow_dispatch:
    inputs:
      tier:
        description: "Gate tier"
        required: false
        default: "full"
        type: choice
        options:
          - a
          - b
          - c
          - d
          - e
          - full

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Tier A (trust core)
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'a' || inputs.tier == 'full'
        run: make security-gate-tier-a
        env:
          ASHLAR_ALLOW_MOCK: "1"

      - name: Tier B (API security)
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'b' || inputs.tier == 'full'
        run: make security-gate-tier-b
        env:
          ASHLAR_ALLOW_MOCK: "1"

      # Runs on every pull_request, like Tiers A and B above it. It was `github.event_name ==
      # 'workflow_dispatch' && …`, which is FALSE on a pull_request — this workflow's only automatic
      # trigger — so the CLI's attacker-reachable surface (the bounded .ashpkg read, the pull
      # refusal rows, the untrusted-output escaping) had no automatic runner at all. Measured at
      # ~2.4s, so cost is not a reason to leave it dispatch-only.
      - name: Tier C (trust CLI)
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'c' || inputs.tier == 'full'
        run: make security-gate-tier-c
        env:
          ASHLAR_ALLOW_MOCK: "1"

      # Same `!=` form as Tiers A–C so pull_request runs the supply-chain
      # scan. A failed `dotnet list` is a FAIL, not a warning-only PASS.
      - name: Tier D (supply chain)
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'd' || inputs.tier == 'full'
        run: make security-gate-tier-d
        env:
          SECURITY_GATE_STRICT_SUPPLY_CHAIN: "1"

      # Same `!=` form as Tiers A–C so pull_request runs the counted host
      # suite (53). The air-gapped container proof needs Docker and stays
      # on dispatch / the release-manager lane.
      - name: Tier E (air-gapped host suite)
        if: github.event_name != 'workflow_dispatch' || inputs.tier == 'e' || inputs.tier == 'full'
        run: make security-gate-tier-e
        env:
          ASHLAR_ALLOW_MOCK: "1"

      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-reports
          path: .ashlar/security-gate/**
          if-no-files-found: ignore
          retention-days: 30
