name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: [8.0.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for commitlint
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install commitlint
        run: npm install
      - name: Validate commit messages
        run: |
          # Only validate commits in the current PR
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose
          else
            # For push events, validate the last commit
            npx commitlint --from HEAD~1 --to HEAD --verbose
          fi
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: ${{ matrix.dotnet }} }
      - name: Restore dependencies
        run: dotnet restore
      - name: Build solution
        run: dotnet build -c Release -warnaserror
      - name: Run unit tests
        run: dotnet test -c Release --no-build --verbosity normal
      - name: Run integration tests
        run: dotnet test tests/Nexo.Tests.Integration/Nexo.Tests.Integration/Nexo.Tests.Integration.csproj -c Release --no-build --verbosity normal
      - name: Run tests with coverage
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --verbosity normal
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false