name: "E1M1 Blockout Interaction Test"
description: "Test sequence for the first level of the Doom-style demo"

setup:
  - "Load E1M1_Blockout scene"
  - "Spawn player at (0, 1, 0)"
  - "Spawn 3 EnemyImps in different rooms"
  - "Place BlueKey in first room"
  - "Place BlueDoor between first and second room"

test_sequence:
  - name: "Player Movement"
    steps:
      - "Move forward (W) for 2 seconds"
      - "Turn right (mouse) 90 degrees"
      - "Move forward (W) for 2 seconds"
      - "Jump (Space) 3 times"
    expected: "Player moves smoothly, can turn, can jump"
    
  - name: "Weapon System"
    steps:
      - "Aim at wall"
      - "Fire shotgun (Left Click) 5 times"
      - "Reload (R key)"
      - "Fire until empty"
    expected: "Weapon fires, shows muzzle flash, plays audio, reloads correctly"
    
  - name: "Enemy AI"
    steps:
      - "Move close to first enemy"
      - "Wait for enemy to detect player"
      - "Move away from enemy"
      - "Wait for enemy to return to patrol"
    expected: "Enemy detects player, chases, attacks, returns to patrol"
    
  - name: "Key Collection"
    steps:
      - "Move to BlueKey location"
      - "Walk into key"
      - "Check inventory"
    expected: "Key is collected, inventory updated, audio plays"
    
  - name: "Door Interaction"
    steps:
      - "Move to BlueDoor without key"
      - "Try to open door"
      - "Collect BlueKey"
      - "Return to door and open it"
    expected: "Door locked without key, opens with key, audio plays"
    
  - name: "Combat"
    steps:
      - "Find enemy"
      - "Shoot enemy until dead"
      - "Take damage from enemy"
      - "Check health display"
    expected: "Enemy takes damage and dies, player takes damage, HUD updates"

validation_checks:
  - "Player health decreases when taking damage"
  - "Enemy health decreases when shot"
  - "Ammo count decreases when firing"
  - "Keys are removed from world when collected"
  - "Doors open and close correctly"
  - "Audio plays for all actions"
  - "HUD displays correct information"
  - "No console errors or warnings"

performance_checks:
  - "Frame rate stays above 30 FPS"
  - "No memory leaks during 5-minute play session"
  - "NavMesh updates don't cause hitches"
  - "Audio doesn't crackle or drop out"
