scenario: examples/pii_redact.yaml
inputs:
  - tests/fixtures/docs/*.pdf

modes:
  - name: off
    env:
      NEXO_AI_MODE: off
    asserts:
      - type: no_network_egress
      - type: structure_contains
        file: outputs/report.csv
        must_have_columns: [file, pii_found, locations]

  - name: hybrid_local
    env:
      NEXO_AI_MODE: hybrid
      NEXO_PROVIDER: local
      NEXO_MODEL: llama3
    asserts:
      - type: completes_within_ms
        limit: 10000
      - type: structure_contains
        file: outputs/report.csv
        must_have_columns: [file, pii_found, locations, confidence]

  - name: embedded_cloud
    env:
      NEXO_AI_MODE: embedded
      NEXO_PROVIDER: openai
      NEXO_MODEL: gpt-4o
    asserts:
      - type: semantic_equivalence
        against: outputs/report.csv
        reference: tests/baselines/pii_ref.csv
        metric: jaccard_tokens
        threshold: 0.80
