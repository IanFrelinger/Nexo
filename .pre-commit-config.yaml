# https://pre-commit.com — optional; see CONTRIBUTING.md
repos:
  - repo: local
    hooks:
      - id: verify-pack-ashlar-hosting-graph-alignment
        name: verify pack-ashlar-hosting-graph vs Ashlar.Hosting MSBuild graph
        entry: python3 scripts/verify-pack-ashlar-hosting-graph-alignment.py
        language: system
        pass_filenames: false
        files: ^(scripts/pack-ashlar-hosting-graph\.(sh|ps1)|scripts/pack-ashlar-hosting-graph\.allowlist\.txt|scripts/verify-pack-ashlar-hosting-graph-alignment\.py|src/Ashlar\.Hosting/.*|src/Ashlar\..*/.*\.csproj)$
