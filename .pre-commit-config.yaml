# https://pre-commit.com — optional; see CONTRIBUTING.md
repos:
  - repo: local
    hooks:
      - id: verify-pack-nexo-hosting-graph-alignment
        name: verify pack-nexo-hosting-graph vs Nexo.Hosting MSBuild graph
        entry: python3 scripts/verify-pack-nexo-hosting-graph-alignment.py
        language: system
        pass_filenames: false
        files: ^(scripts/pack-nexo-hosting-graph\.(sh|ps1)|scripts/pack-nexo-hosting-graph\.allowlist\.txt|scripts/verify-pack-nexo-hosting-graph-alignment\.py|src/Nexo\.Hosting/.*|src/Nexo\..*/.*\.csproj)$
