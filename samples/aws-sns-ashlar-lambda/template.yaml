AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Sample Lambda that forwards SNS payloads to Ashlar.API /api/ingress/sms/sns (HTTP JSON shape).

Parameters:
  AshlarSmsUrl:
    Type: String
    Description: HTTPS URL for Ashlar POST /api/ingress/sms/sns

Resources:
  Forwarder:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs20.x
      CodeUri: .
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          ASHLAR_SMS_URL: !Ref AshlarSmsUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
