services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  nexo-api:
    build:
      context: .
      dockerfile: .docker/Dockerfile.api
    depends_on:
      - ollama
    environment:
      ASPNETCORE_URLS: http://+:8080
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      NEXO_DAILIES_PATH: /data/dailies
      # Optional: match portal advisory + startup logs to how you expose the API (see docs/TailscaleAndNexo.md).
      # Nexo__Security__ExposureProfile: Tailnet
      # Nexo__Security__ShowAdvisoryInPortal: "true"
      # Nexo__Security__CustomAdvisory: "Restrict with Tailscale ACLs; Ollama not on funnel."
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nexo-dailies:/data/dailies
    restart: unless-stopped

volumes:
  ollama-models:
  nexo-dailies:
