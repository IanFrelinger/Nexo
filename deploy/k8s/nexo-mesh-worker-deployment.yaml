# Example worker Deployment for Nexo KubernetesWorkloadScaler.
# Scale with:
#   kubectl -n nexo scale deployment/nexo-mesh-worker --replicas=3
# or PUT /api/workloads/mesh-worker/replicas when Provider=kubernetes.
apiVersion: v1
kind: Namespace
metadata:
  name: nexo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexo-mesh-worker
  namespace: nexo
  labels:
    app.kubernetes.io/name: nexo-mesh-worker
    app.kubernetes.io/part-of: nexo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexo-mesh-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexo-mesh-worker
    spec:
      containers:
        - name: worker
          # Replace with your published worker image.
          image: nexo-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: NEXO_DEPLOYMENT_PROFILE
              value: Worker
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
