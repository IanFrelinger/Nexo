# Example worker Deployment for Nexo KubernetesWorkloadScaler.
# Scale with:
#   kubectl -n nexo scale deployment/nexo-mesh-worker --replicas=3
# or PUT /api/workloads/mesh-worker/replicas when Provider=kubernetes.
apiVersion: v1
kind: Namespace
metadata:
  name: nexo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexo-mesh-worker
  namespace: nexo
  labels:
    app.kubernetes.io/name: nexo-mesh-worker
    app.kubernetes.io/part-of: nexo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexo-mesh-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexo-mesh-worker
    spec:
      containers:
        - name: worker
          # Nexo.API image (.docker/Dockerfile.api). Local build shown; the published image is
          # ghcr.io/ianfrelinger/nexo-api:<tag> — pin a semver or sha-<12-char-commit> tag
          # (docs/DEPLOYMENT.md, "Golden path A"), never :latest.
          image: nexo-api:local
          # image: ghcr.io/ianfrelinger/nexo-api:sha-<commit>
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            # Must be one of the values AddNexo() accepts: full, server, edge, air-gapped, system
            # (NexoServiceCollectionExtensions.Deployment.cs). Anything else throws at startup ->
            # CrashLoopBackOff. A mesh worker executes bricks over the runtime transport, so it needs
            # the Server composition (same modules as Full); Edge strips NCR + agents.
            - name: NEXO_DEPLOYMENT_PROFILE
              value: server
            # Runtime state (LiteDB stores) is per-replica scratch here; mount a PVC at /data/state
            # to keep it (docs/DEPLOYMENT.md, "Runtime state").
            - name: NEXO_STATE_DIR
              value: /data/state
          ports:
            - name: http
              containerPort: 8080
          # /health is liveness (constant 200 while the process serves HTTP); /ready flips to 503 while the
          # host is starting and once shutdown begins so the endpoint drains before Kestrel closes.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # The image runs as the aspnet 'app' user (uid 1654); /data is owned by it.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
