services:
  ollama:
    image: ${ASHLAR_OLLAMA_IMAGE:-ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ashlar-api:
    build:
      context: ../..
      dockerfile: .docker/Dockerfile.api
    depends_on:
      - ollama
    environment:
      ASPNETCORE_URLS: http://+:8080
      # All three Ollama families point at the bundled service; the default (MEAI) model path and the NCR
      # probe fall back to OLLAMA_BASE_URL now, but set them explicitly so nothing dials the container's own
      # localhost:11434 (see docs/Configuration.md, "Ollama").
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__Meai__OllamaBaseUrl: http://ollama:11434
      Ashlar__Meai__OllamaModel: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__NodeCapabilityRuntime__Ollama__BaseUrl: http://ollama:11434
      ASHLAR_DAILIES_PATH: /data/dailies
      # Runtime state (LiteDB stores, snapshots) on a named volume so it survives `up --force-recreate`
      # (docs/DEPLOYMENT.md, "Runtime state"). Keep aligned with the ashlar-state mount below.
      ASHLAR_STATE_DIR: /data/state
      # Optional: match portal advisory + startup logs to how you expose the API (see docs/TailscaleAndAshlar.md).
      # Ashlar__Security__ExposureProfile: Tailnet
      # Ashlar__Security__ShowAdvisoryInPortal: "true"
      # Ashlar__Security__CustomAdvisory: "Restrict with Tailscale ACLs; Ollama not on funnel."
      # MCP/A2A protocol ingress is OFF unless explicitly enabled (fail-closed defaults;
      # see docs/architecture/ProtocolIntegration-MCP-A2A.md before flipping any of these).
      Ashlar__Mcp__Server__Enabled: ${Ashlar__Mcp__Server__Enabled:-false}
      Ashlar__Mcp__Client__Enabled: ${Ashlar__Mcp__Client__Enabled:-false}
      Ashlar__A2A__Server__Enabled: ${Ashlar__A2A__Server__Enabled:-false}
      Ashlar__A2A__Transport__Enabled: ${Ashlar__A2A__Transport__Enabled:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ashlar-dailies:/data/dailies
      - ashlar-state:/data/state
    restart: unless-stopped

volumes:
  ollama-models:
  ashlar-dailies:
  ashlar-state:
