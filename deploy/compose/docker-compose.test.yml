services:
  test-ubuntu:
    build:
      context: ../..
      dockerfile: .docker/Dockerfile.test-caching
    image: ashlar-test:ubuntu
    volumes:
      - ../../test-results:/workspace/test-results
    environment:
      - DOTNET_VERSION=10.0
    command: >
      bash -lc "dotnet test /workspace/src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj
      -f net10.0
      --filter 'FullyQualifiedName~BaseFrameworkSmokeTests'
      --logger 'trx;LogFileName=ubuntu-baseframework.trx'
      --results-directory /workspace/test-results
      > /workspace/test-results/ubuntu-logs.txt 2>&1
      && printf '{\"ok\":true,\"suite\":\"BaseFrameworkSmokeTests\",\"framework\":\"net10.0\"}\n'
      > /workspace/test-results/ubuntu-results.json"

