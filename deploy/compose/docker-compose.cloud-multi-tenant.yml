# Product Fleet Phase 2 — multi-tenant Cloud staging shape (local dev).
# See docs/product-fleet/cloud-reference-deployment.md
#
# ASHLAR_API_KEY is REQUIRED (no default): tenant / org / user are client-asserted headers, so the
# mutating API must at least be credentialed. Generate one, e.g. export ASHLAR_API_KEY="$(openssl rand -hex 32)"
services:
  ollama:
    image: ${ASHLAR_OLLAMA_IMAGE:-ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ashlar-api:
    build:
      context: ../..
      dockerfile: .docker/Dockerfile.api
    depends_on:
      - ollama
    environment:
      ASPNETCORE_URLS: http://+:8080
      # All three Ollama families point at the bundled service so the default (MEAI) model path and the
      # NCR probe never dial the container's own localhost:11434 (docs/Configuration.md, "Ollama").
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__Meai__OllamaBaseUrl: http://ollama:11434
      Ashlar__Meai__OllamaModel: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__NodeCapabilityRuntime__Ollama__BaseUrl: http://ollama:11434
      ASHLAR_DAILIES_PATH: /data/dailies
      # Runtime state (LiteDB stores incl. copilot tasks, snapshots) on a named volume (docs/DEPLOYMENT.md, "Runtime state").
      ASHLAR_STATE_DIR: /data/state
      # Built-in auth on the shared API process. X-Ashlar-Tenant / X-Ashlar-User / X-Ashlar-Org are trusted
      # only behind this credential (or an authenticating proxy that sets them).
      Ashlar__Security__AuthorizationMode: ${ASHLAR_AUTH_MODE:-ApiKey}
      Ashlar__Security__AuthorizationScope: ${ASHLAR_AUTH_SCOPE:-MutatingApi}
      Ashlar__Security__ApiKey: ${ASHLAR_API_KEY:?Set ASHLAR_API_KEY (X-Ashlar-Api-Key secret for the cloud API); no default is shipped}
      Ashlar__Product__RequireOrgMembership: "true"
      Ashlar__Entitlements__DeploymentMode: Cloud
      Ashlar__Entitlements__MaxCopilotSubmissionsPerHour: ${ASHLAR_MAX_COPILOT_PER_HOUR:-120}
      Ashlar__Entitlements__Seats: ${ASHLAR_SEATS:-25}
      Ashlar__Entitlements__MaxConcurrency: ${ASHLAR_MAX_CONCURRENCY:-3}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ashlar-cloud-dailies:/data/dailies
      - ashlar-cloud-data:/data/copilot
      - ashlar-cloud-state:/data/state
    restart: unless-stopped

volumes:
  ollama-models:
  ashlar-cloud-dailies:
  ashlar-cloud-data:
  ashlar-cloud-state:
