# Ollama only — models run in Docker; Ashlar CLI/API on the host talks to localhost:11434.
#
#   docker compose -f docker-compose.ollama.yml up -d
#   docker compose -f docker-compose.ollama.yml exec ollama ollama pull llama3.1:latest
#
# Or: powershell -File scripts/run-ollama-docker.ps1 -Model llama3.1:latest
#     bash scripts/run-ollama-docker.sh llama3.1:latest
#
# Host env for Ashlar: OLLAMA_BASE_URL=http://127.0.0.1:11434  OLLAMA_MODEL=<same tag>
# NCR probe: Ashlar__NodeCapabilityRuntime__Ollama__BaseUrl=http://127.0.0.1:11434

services:
  ollama:
    image: ${ASHLAR_OLLAMA_IMAGE:-ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2}
    ports:
      # Loopback only (matches the other stacks); Ollama has no auth, so do not publish it on 0.0.0.0.
      - "127.0.0.1:${ASHLAR_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
