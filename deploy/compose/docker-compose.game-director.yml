# Ashlar Game Director Studio — portal + sidecar host + Ollama (air-gap friendly after image build).
# From repo root:
#   docker compose -f deploy/compose/docker-compose.game-director.yml up -d --build
#   docker compose -f deploy/compose/docker-compose.game-director.yml exec ollama ollama pull llama3.1:latest
#
# Relative host paths (bind mount, build context) resolve against THIS file's directory, not the
# shell CWD, so the defaults below are ../.. = repo root. Set ASHLAR_REPO_ROOT to mount another tree.
# Compose reads .env from this directory (deploy/compose/.env); use --env-file <path> otherwise.
#
# ASHLAR_API_KEY is REQUIRED (no default): the host runs AuthorizationMode=ApiKey and this file no
# longer ships a dev key. Generate one, e.g.  export ASHLAR_API_KEY="$(openssl rand -hex 32)"

services:
  ollama:
    image: ${ASHLAR_OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "127.0.0.1:${ASHLAR_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  game-director:
    build:
      context: ${ASHLAR_BUILD_CONTEXT:-../..}
      dockerfile: ${ASHLAR_GAME_DIRECTOR_DOCKERFILE:-.docker/Dockerfile.game-director}
    depends_on:
      - ollama
    working_dir: ${ASHLAR_CONTAINER_WORKDIR:-/work}
    entrypoint: ["dotnet", "/app/GameDirector.Host.dll"]
    environment:
      ASPNETCORE_CONTENTROOT: /app
      ASPNETCORE_URLS: http://+:8080
      # All three Ollama families follow OLLAMA_BASE_URL / OLLAMA_MODEL so the default (MEAI) model path,
      # the NCR probe and the provider factory dial the same host (docs/Configuration.md, "Ollama").
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__Meai__OllamaBaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434}
      Ashlar__Meai__OllamaModel: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__NodeCapabilityRuntime__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434}
      ASHLAR_BACKGROUND_AGENTS_CONFIG: ${ASHLAR_BACKGROUND_AGENTS_CONFIG:-/work/apps/game-director/agent_set.game_director.json}
      Ashlar__Security__AuthorizationMode: ApiKey
      Ashlar__Security__ApiKey: ${ASHLAR_API_KEY:?Set ASHLAR_API_KEY (X-Ashlar-Api-Key secret for the Game Director host); no default is shipped}
      Ashlar__Trust__ActivePackId: internal-only
      GameDirector__ApiBaseUrl: http://127.0.0.1:8080
      GameDirector__BalanceWatchPath: /work/data/balance
      GameDirector__MapWatchPath: /work/data/maps
    ports:
      - "127.0.0.1:${ASHLAR_GAME_DIRECTOR_HTTP_PORT:-8080}:8080"
    volumes:
      # Default ../.. is the repo root (relative to deploy/compose/); '.' would mount only deploy/compose/
      # and ASHLAR_BACKGROUND_AGENTS_CONFIG would be missing -> host throws at startup -> restart loop.
      - ${ASHLAR_REPO_ROOT:-../..}:${ASHLAR_CONTAINER_WORKDIR:-/work}${ASHLAR_REPO_MOUNT_SUFFIX:-}
    restart: unless-stopped

volumes:
  ollama-models:
