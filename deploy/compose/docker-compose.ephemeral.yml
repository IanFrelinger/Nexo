# Ephemeral stack for ashlar orchestrate/agent with Ollama.
# From repo root:
#   docker compose -f deploy/compose/docker-compose.ephemeral.yml run --rm ashlar [args]
# To include the postgres service, enable its profile (the env var alone does nothing):
#   docker compose -f deploy/compose/docker-compose.ephemeral.yml --profile db run --rm ashlar [args]
# Requires Docker and the .NET SDK image for the ashlar build.
#
# For in-process ephemeral (no container for ashlar), use: ashlar orchestrate "request" --ephemeral
# That spins up ephemeral Ollama only; ashlar runs on host.
#
# Relative host paths (build context, bind mount) resolve against THIS file's directory, so ../.. is the repo root.

services:
  ollama:
    image: ${ASHLAR_OLLAMA_IMAGE:-ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2}
    ports:
      - "127.0.0.1:11434:11434"
    # No volumes - model blobs stay in container, discarded on remove

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ashlar_ephemeral
      POSTGRES_DB: ashlar
    ports:
      - "127.0.0.1:5432:5432"
    profiles:
      - db
    # No volumes - data discarded on remove

  # ashlar CLI built from the repo (.docker/Dockerfile.cli), talking to the ollama service above.
  # `run` activates the service's profile automatically:
  #   docker compose -f deploy/compose/docker-compose.ephemeral.yml run --rm ashlar orchestrate "request"
  # The image runs as the non-root 'app' user; the mounted workspace must be readable by that uid
  # (add `user: "${UID:-1000}"` here if the CLI has to write into it). Runtime state stays in
  # /data/state inside the container (ASHLAR_STATE_DIR) and is discarded with it.
  ashlar:
    build:
      context: ../..
      dockerfile: .docker/Dockerfile.cli
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      Ashlar__Meai__OllamaBaseUrl: http://ollama:11434
      Ashlar__Meai__OllamaModel: ${OLLAMA_MODEL:-llama3.2}
      Ashlar__NodeCapabilityRuntime__Ollama__BaseUrl: http://ollama:11434
    depends_on:
      - ollama
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    profiles:
      - full
