# Ashlar.API + Ollama + Director portal + mounted workspace + background agents (default JSON: apps/runtime-studio/config/agent_set.local.json).
# How this differs from docker-compose.portal.yml and from the CLI daemon: apps/runtime-studio/README.md#how-runtime-studio-fits-with-ashlar-api
#
# From repo root:
#   docker compose -f deploy/compose/docker-compose.agent-server.yml up -d --build
#   docker compose -f deploy/compose/docker-compose.agent-server.yml exec ollama ollama pull llama3.1:latest
#
# Relative host paths (bind mount, build context) resolve against THIS file's directory, not the
# shell CWD, so the defaults below are ../.. = repo root. Set ASHLAR_REPO_ROOT to mount another tree.
# Compose also reads .env from this directory (deploy/compose/.env), not the repo root; use
# --env-file <path> to load a file kept elsewhere.
# Env: docs/config/agent-server.env.example
# Portal: http://localhost:${ASHLAR_AGENT_SERVER_HTTP_PORT:-8080}/

services:
  ollama:
    image: ${ASHLAR_OLLAMA_IMAGE:-ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2}
    ports:
      - "127.0.0.1:${ASHLAR_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ashlar-api:
    build:
      context: ${ASHLAR_BUILD_CONTEXT:-../..}
      dockerfile: ${ASHLAR_AGENT_SERVER_DOCKERFILE:-.docker/Dockerfile.agent-server}
    depends_on:
      - ollama
    working_dir: ${ASHLAR_CONTAINER_WORKDIR:-/work}
    entrypoint: ["dotnet", "/app/Ashlar.API.dll"]
    environment:
      # Published app + wwwroot live under /app; working_dir is /work for mounted repo + agents.
      # Without this, static portal 404s because wwwroot is not at /work/wwwroot.
      ASPNETCORE_CONTENTROOT: /app
      ASPNETCORE_URLS: http://+:8080
      # All three Ollama families follow OLLAMA_BASE_URL / OLLAMA_MODEL so the default (MEAI) model path,
      # the NCR probe and the provider factory dial the same host (docs/Configuration.md, "Ollama").
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__Meai__OllamaBaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434}
      Ashlar__Meai__OllamaModel: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__NodeCapabilityRuntime__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434}
      ASHLAR_DAILIES_PATH: ${ASHLAR_DAILIES_PATH:-/data/dailies}
      # Runtime state (LiteDB stores, snapshots) on a named volume, NOT in the mounted repo under /work
      # (docs/DEPLOYMENT.md, "Runtime state"). Keep aligned with the ashlar-state mount below.
      ASHLAR_STATE_DIR: ${ASHLAR_STATE_DIR:-/data/state}
      ASHLAR_BACKGROUND_AGENTS_CONFIG: ${ASHLAR_BACKGROUND_AGENTS_CONFIG:-/work/apps/runtime-studio/config/agent_set.local.json}
      Ashlar__Barriers__RequireExplicitBarrier: ${Ashlar__Barriers__RequireExplicitBarrier:-false}
      ASHLAR_OBSERVATION_DEGRADED_MODE: ${ASHLAR_OBSERVATION_DEGRADED_MODE:-1}
      # Self-extender arming file (Passive until it says otherwise). Empty = the in-container
      # default ~/.ashlar/agent-mode.json, which does not survive a restart; see docs/config/agent-server.env.example.
      ASHLAR_AGENT_MODE_PATH: ${ASHLAR_AGENT_MODE_PATH:-}
      # MCP/A2A protocol ingress is OFF unless explicitly enabled (fail-closed defaults;
      # see docs/architecture/ProtocolIntegration-MCP-A2A.md before flipping any of these).
      Ashlar__Mcp__Server__Enabled: ${Ashlar__Mcp__Server__Enabled:-false}
      Ashlar__Mcp__Client__Enabled: ${Ashlar__Mcp__Client__Enabled:-false}
      Ashlar__A2A__Server__Enabled: ${Ashlar__A2A__Server__Enabled:-false}
      Ashlar__A2A__Transport__Enabled: ${Ashlar__A2A__Transport__Enabled:-false}
    ports:
      - "127.0.0.1:${ASHLAR_AGENT_SERVER_HTTP_PORT:-8080}:8080"
    volumes:
      # Named volume; keep mount path aligned with ASHLAR_DAILIES_PATH (default /data/dailies).
      - ashlar-dailies:/data/dailies
      # Named volume; keep mount path aligned with ASHLAR_STATE_DIR (default /data/state).
      - ashlar-state:/data/state
      # Default ../.. is the repo root (relative to deploy/compose/); '.' would mount only deploy/compose/
      # and ASHLAR_BACKGROUND_AGENTS_CONFIG would be missing -> Ashlar.API throws at startup -> restart loop.
      - ${ASHLAR_REPO_ROOT:-../..}:${ASHLAR_CONTAINER_WORKDIR:-/work}${ASHLAR_REPO_MOUNT_SUFFIX:-}
    restart: unless-stopped

volumes:
  ollama-models:
  ashlar-dailies:
  ashlar-state:
