# Product Fleet Phase 0.4 — reference single-tenant Private shape (local dev / pilot).
# See docs/product-fleet/private-reference-deployment.md
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ashlar-api:
    build:
      context: ../..
      dockerfile: .docker/Dockerfile.api
    depends_on:
      - ollama
    environment:
      ASPNETCORE_URLS: http://+:8080
      # All three Ollama families point at the bundled service so the default (MEAI) model path and the
      # NCR probe never dial the container's own localhost:11434 (docs/Configuration.md, "Ollama").
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__Meai__OllamaBaseUrl: http://ollama:11434
      Ashlar__Meai__OllamaModel: ${OLLAMA_MODEL:-llama3.1:latest}
      Ashlar__NodeCapabilityRuntime__Ollama__BaseUrl: http://ollama:11434
      ASHLAR_DAILIES_PATH: /data/dailies
      # Runtime state (LiteDB stores incl. copilot tasks, snapshots) on a named volume (docs/DEPLOYMENT.md, "Runtime state").
      ASHLAR_STATE_DIR: /data/state
      Ashlar__Product__DefaultTenantId: ${ASHLAR_DEFAULT_TENANT_ID:-default}
      Ashlar__Product__AllowedTenantIds__0: ${ASHLAR_DEFAULT_TENANT_ID:-default}
      Ashlar__Entitlements__MaxCopilotSubmissionsPerHour: ${ASHLAR_MAX_COPILOT_PER_HOUR:-0}
      Ashlar__Entitlements__DeploymentMode: Private
      Ashlar__Entitlements__Seats: ${ASHLAR_SEATS:-5}
      Ashlar__Entitlements__MaxConcurrency: ${ASHLAR_MAX_CONCURRENCY:-2}
      ASHLAR_LICENSE_FILE: ${ASHLAR_LICENSE_FILE:-}
      Ashlar__PrivateLicense__EnforceLicense: ${ASHLAR_ENFORCE_LICENSE:-false}
      Ashlar__PrivateLicense__AllowReadOnlyWhenExpired: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ashlar-dailies:/data/dailies
      - ashlar-copilot-data:/data/copilot
      - ashlar-state:/data/state
    restart: unless-stopped

volumes:
  ollama-models:
  ashlar-dailies:
  ashlar-copilot-data:
  ashlar-state:
