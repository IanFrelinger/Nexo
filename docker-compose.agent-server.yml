# Nexo.API + Ollama + Director portal + mounted workspace + background agents (default JSON: apps/runtime-studio/config/agent_set.local.json).
# How this differs from docker-compose.portal.yml and from the CLI daemon: apps/runtime-studio/README.md#how-runtime-studio-fits-with-nexo-api
#
# From repo root:
#   docker compose -f docker-compose.agent-server.yml up -d --build
#   docker compose -f docker-compose.agent-server.yml exec ollama ollama pull llama3.1
#
# Env: docs/config/agent-server.env.example
# Portal: http://localhost:${NEXO_AGENT_SERVER_HTTP_PORT:-8080}/

services:
  ollama:
    image: ${NEXO_OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "127.0.0.1:${NEXO_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  nexo-api:
    build:
      context: ${NEXO_BUILD_CONTEXT:-.}
      dockerfile: ${NEXO_AGENT_SERVER_DOCKERFILE:-.docker/Dockerfile.agent-server}
    depends_on:
      - ollama
    working_dir: ${NEXO_CONTAINER_WORKDIR:-/work}
    entrypoint: ["dotnet", "/app/Nexo.API.dll"]
    environment:
      # Published app + wwwroot live under /app; working_dir is /work for mounted repo + agents.
      # Without this, static portal 404s because wwwroot is not at /work/wwwroot.
      ASPNETCORE_CONTENTROOT: /app
      ASPNETCORE_URLS: http://+:8080
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      NEXO_DAILIES_PATH: ${NEXO_DAILIES_PATH:-/data/dailies}
      NEXO_BACKGROUND_AGENTS_CONFIG: ${NEXO_BACKGROUND_AGENTS_CONFIG:-/work/apps/runtime-studio/config/agent_set.local.json}
      Nexo__Barriers__RequireExplicitBarrier: ${Nexo__Barriers__RequireExplicitBarrier:-false}
      NEXO_OBSERVATION_DEGRADED_MODE: ${NEXO_OBSERVATION_DEGRADED_MODE:-1}
      # Point LiteDB state to the named volume so it survives container restarts.
      Nexo__PatternStorePath: /data/nexo-state/nexo-patterns.db
      NEXO_TRUST_AUDIT_DB: /data/nexo-state/nexo-trust-audit.db
      NEXO_KNOWLEDGE_LOG_PATH: /data/nexo-state/nexo-knowledge.db
      NEXO_CONFIG_PATH: /data/nexo-state/config.json
    ports:
      - "127.0.0.1:${NEXO_AGENT_SERVER_HTTP_PORT:-8080}:8080"
    volumes:
      # Named volume; keep mount path aligned with NEXO_DAILIES_PATH (default /data/dailies).
      - nexo-dailies:/data/dailies
      # LiteDB state files (copilot tasks, patterns, adaptation, trust audit, preferences).
      - nexo-state:/data/nexo-state
      - ${NEXO_REPO_ROOT:-.}:${NEXO_CONTAINER_WORKDIR:-/work}${NEXO_REPO_MOUNT_SUFFIX:-}
    restart: unless-stopped

volumes:
  ollama-models:
  nexo-dailies:
  nexo-state:
