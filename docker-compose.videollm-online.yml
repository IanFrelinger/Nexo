# VideoLLM-online: streaming video LLM for real-time video understanding
# See https://github.com/showlab/videollm-online
#
# Prerequisites: NVIDIA GPU, nvidia-container-toolkit
#   Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# Usage:
#   docker compose -f docker-compose.videollm-online.yml up -d
#   # Open http://localhost:7860 for Gradio UI
#
# First run downloads ~8GB model (chenjoya/videollm-online-8b-v1plus)
version: '3.8'

services:
  videollm-online:
    build:
      context: .
      dockerfile: .docker/Dockerfile.videollm-online
    image: videollm-online:latest
    container_name: nexo-videollm-online
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "7860:7860"
    volumes:
      - videollm-cache:/app/.cache/huggingface
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    # Required for PyTorch/CUDA shared memory
    shm_size: 8gb
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  videollm-cache:
